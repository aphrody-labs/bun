# cargo-deny (https://embarkstudios.github.io/cargo-deny/) — licences, advisories,
# duplicate versions and sources of the Rust workspace. `bun run rust:deny`.
# Schema version 2 (cargo-deny >= 0.14.21).

[graph]
# Every target the workspace is built for (rust-toolchain.toml + wasm32);
# empty would check all ~250 rustc targets.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-linux-android",
  "aarch64-linux-android",
  "x86_64-unknown-freebsd",
  "aarch64-unknown-freebsd",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "wasm32-wasip1-threads",
]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unmaintained crates are reported for direct dependencies only (transitive
# ones are the upstream crate's call).
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # Dev-dependency of bun_parsers' tests only (XML oracle on trusted fixtures);
  # 0.38 -> 0.41 is a breaking bump of the test code.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml: dev-dependency, trusted test fixtures" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml: dev-dependency, trusted test fixtures" },
  # paste is feature-complete and archived; pastey is the drop-in successor
  # (bun_collections macros), to swap with the next macro change there.
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, compile-time only, no runtime code" },
]

[licenses]
version = 2
# Bun ships a single MIT binary; every licence below is permissive or
# file-level copyleft (MPL-2.0: cssparser/selectors, unmodified).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Workspace crates are internal parts of one binary: no `license` field,
# `publish = false` in each manifest.
[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies (`bun_* = { path = … }`) are not wildcards; this only
# applies to `publish = false` crates.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # The TLS stack is BoringSSL (node:tls / node:crypto compatibility); a second
  # TLS or crypto backend would double the binary's crypto surface.
  { name = "openssl", reason = "BoringSSL is the only TLS/crypto stack" },
  { name = "openssl-sys", reason = "BoringSSL is the only TLS/crypto stack" },
  { name = "native-tls", reason = "BoringSSL is the only TLS/crypto stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources are pinned (rev or tag) by the members that need them; nothing
# else may pull from git. aphrody-labs hosts the forks (PyO3, wry, filmcraft).
allow-git = [
  # libcosmic and its pop-os stack: bun-cosmic and the cosmic-window ffi fixture.
  "https://github.com/pop-os/libcosmic",
  "https://github.com/pop-os/cosmic-protocols",
  "https://github.com/pop-os/dbus-settings-bindings",
  "https://github.com/pop-os/freedesktop-icons",
  "https://github.com/pop-os/smithay-clipboard",
  "https://github.com/pop-os/softbuffer",
  "https://github.com/pop-os/window_clipboard.git",
  "https://github.com/pop-os/winit.git",
  "https://github.com/iced-rs/cryoglyph.git",
  "https://github.com/jackpot51/rust-atomicwrites",
  # Mullvad VPN daemon (bun_vpn).
  "https://github.com/mullvad/udp-over-tcp",
]

[sources.allow-org]
github = ["aphrody-labs"]
