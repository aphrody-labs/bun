[test]
# Large monorepos (like Bun) may want to specify the test directory more specifically 
# By default, `bun test` scans every single folder recursively which, if you
# have a gigantic submodule (like WebKit), requires lots of directory
# traversals
#
# Instead, we can only scan the test directory for Bun's runtime tests
root = "test"
preload = "./test/preload.ts"

[install]
linker = "isolated"
# CI dependency setup opts out only when its cache is deleted after the call.
# Persistent developer and CI caches can share eligible dependency closures.
globalStore = true
minimumReleaseAge = 259200 # three days
minimumReleaseAgeExcludes = ["typescript", "@aphrody/typesafe-sdk"]

[fmt]
# `bun fmt` formats scripts, packages, src and docs. In test, only the tests: the rest is fixtures.
ignorePatterns = [
  "/*",
  "!/scripts",
  "!/packages",
  "!/src",
  "!/docs",
  "!/test",
  "/test/**",
  "!/test/**/",
  "!/test/**/*.test.[jt]s",
  "!/test/**/*.test.[jt]sx",
  "!/test/**/*.test.[cm][jt]s",
  "!/test/**/*.spec.[jt]s",
  "!/test/**/*.spec.[jt]sx",
  "!/test/**/*.spec.[cm][jt]s",
  "/test/**/*fixture*.*",
]

[lint]
# `bun lint` lints src/js.
config = "oxlint.json"
ignorePatterns = ["/*", "!/src", "/src/*", "!/src/js"]
