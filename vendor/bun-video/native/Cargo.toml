[package]
name = "bun-video-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[features]
default = []
libav = ["dep:ffmpeg-next"]

[dependencies]
ffmpeg-next = { version = "=8.1.0", optional = true, default-features = false, features = ["codec", "format"] }
png = "=0.17.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bun-video-native"
path = "src/main.rs"
