name: aphrody build

# Build de vérification du paquet Terminal (CascadiaPackage, Release x64) après chaque push
# sur la branche aphrody, par le même chemin que le poste local (bun run setup / build).
on:
  push:
    branches: [aphrody]
    paths-ignore: ["**.md", "doc/**"]
  workflow_dispatch:

concurrency:
  group: aphrody-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: aphrody-labs/bun/.github/actions/setup-bun@main
      # L'image ne porte pas les composants UWP de .vsconfig : setup les ajoute (le runner est administrateur).
      - name: setup
        run: bun run setup
      - name: build
        run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            obj/aphrody/*.log
            obj/aphrody/*.binlog
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: CascadiaPackage-x64
          path: src/cascadia/CascadiaPackage/AppPackages/**/*.msix
