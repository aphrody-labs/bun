services:
  omar-postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: omar-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: omar
      POSTGRES_DB: omar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - omar-postgres-data:/var/lib/postgresql
      - omar-postgres-config:/run/secrets
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omar -d omar"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
volumes:
  omar-postgres-data:
    name: omar-postgres-data
  omar-postgres-config:
    name: omar-postgres-config
