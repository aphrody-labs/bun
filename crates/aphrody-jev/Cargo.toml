# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-jev"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/bun"
license = "Apache-2.0 AND MIT"
description = "Bun typed decision protocol, validation and optional endpoint clients"

[features]
default = []
client = ["dep:futures", "dep:reqwest", "dep:rustls", "dep:tokio", "dep:tracing", "dep:url"]
server = ["client", "dep:axum", "tokio/rt-multi-thread", "tokio/macros", "tokio/net"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = { workspace = true }
futures = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }

[[test]]
name = "native"
required-features = ["client"]

[[test]]
name = "router"
required-features = ["client"]

[[test]]
name = "rag"
required-features = ["client"]

[[test]]
name = "server"
required-features = ["server"]

