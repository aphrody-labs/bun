[package]
name = "bun-x"
version = "1.4.8"
description = "X / Twitter native GraphQL + REST client (cookie auth, no API key required). Restored from the published legacy crate `bun_x`."
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "Apache-2.0"
publish = false
readme = "README.md"

[features]
test-support = []

[lib]
name = "bun_x"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
dirs = "7.0.0"
json5 = "1.3.1"
regex = "1.11"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"] }
rusqlite = "0.40"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3.55", features = ["macros", "formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.26.0", features = ["v4", "v7", "serde", "fast-rng"] }

[lints]
workspace = true
