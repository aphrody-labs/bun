[package]
name = "bun-pkg"
version = "1.4.7"
description = "Package contracts and metadata parsers (npm, Cargo sparse, NuGet, vcpkg, PyPI), verified blob store, bounded HTTP ingestion and the store command line. Restored from the published legacy crate `bun_pkg`."
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "Apache-2.0"
publish = false
readme = "README.md"

[lib]
name = "bun_pkg"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
node-semver = "2.2.0"
pep440_rs = "0.7.3"
reflink-copy = "0.1.30"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11.1", default-features = false }
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.2", default-features = false, features = ["fs", "io-util", "rt", "rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }

[lints]
workspace = true
