# Its own workspace: not a member of the Bun workspace at the repository root.
# The aphrody-n2b* crates are published to crates.io by scripts/aphrody/publish-crates.ts;
# crates/napi is the addon behind @aphrody/bun-plugin-n2b and is not published.
[workspace]
resolver = "3"
members = ["crates/n2b-types", "crates/n2b-registry", "crates/n2b-core", "crates/n2b", "crates/napi"]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/bun"
homepage = "https://github.com/aphrody-labs/bun/tree/main/packages/bun-n2b"

[workspace.dependencies]
aphrody-n2b = { path = "crates/n2b", version = "=0.7.1" }
aphrody-n2b-core = { path = "crates/n2b-core", version = "=0.7.1" }
aphrody-n2b-registry = { path = "crates/n2b-registry", version = "=0.7.1" }
aphrody-n2b-types = { path = "crates/n2b-types", version = "=0.7.1" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
colored = "3"
crossbeam-channel = "0.5"
fastembed = { version = "5.13.4", default-features = false }
globset = "0.4"
ignore = "0.4"
memchr = "2"
octocrab = { version = "0.54", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring", "timeout"] }
once_cell = "1"
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_parser = "0.153.0"
oxc_span = "0.153.0"
regex = "1.11"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "blocking", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
similar = "3"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"
which = "8"

assert_cmd = "2"
jsonschema = { version = "0.58", default-features = false }
proptest = "1"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
