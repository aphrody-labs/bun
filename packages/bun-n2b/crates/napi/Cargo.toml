[package]
name = "bun-plugin-n2b-napi"
description = "Node-API addon behind @aphrody/bun-plugin-n2b."
license = "Apache-2.0"
publish = false

[package.version]
workspace = true

[package.edition]
workspace = true

[package.rust-version]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3"

[dependencies.bun_migrate]
workspace = true

[dependencies.napi]
version = "3"
default-features = false
features = ["napi4", "serde-json"]

[dependencies.serde_json]
version = "1.0.151"
features = ["preserve_order"]

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
