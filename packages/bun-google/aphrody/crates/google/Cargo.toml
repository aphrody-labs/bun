# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-google"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
description = "Canonical Rust facade for Aphrody Google Cloud, Gemini, Web and Antigravity integrations."
[lints]
workspace = true

[features]
default = ["full"]
full = ["search", "search-cache", "browser-search", "dep:aphrody-antigravity", "dep:aphrody-gemini-web", "dep:aphrody-gemini-runtime", "dep:aphrody-model-client", "dep:clap", "dep:futures"]
search = ["dep:tokio", "dep:rustls", "dep:obscura-dom", "dep:regex", "dep:reqwest", "dep:url", "dep:chrono"]
search-cache = ["search", "dep:rusqlite"]
browser-search = ["search", "dep:obscura"]

[dependencies]
aphrody-antigravity = { workspace = true, optional = true }
aphrody-gemini-web = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The Gemini CLI process adapter, the `Send` model-client streams, the CLI, routes, search and
# translate run on the host. wasm32 keeps the facade over antigravity, gemini-web and the
# language atlas.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aphrody-gemini-runtime = { workspace = true, optional = true }
aphrody-model-client = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "time"] }
rustls = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
obscura-dom = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
obscura = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
