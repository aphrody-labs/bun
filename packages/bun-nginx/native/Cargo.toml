[package]
name = "bun-nginx-module"
version = "1.4.6"
edition = "2024"
rust-version = "1.97"
license = "MIT AND Apache-2.0"
publish = false
build = "build.rs"

# The engine's ABI belongs to NGINX, so this crate is outside Bun's JSC workspace.
[lib]
name = "ngx_http_bun_module"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ngx = { path = "../../../vendor/ngx-rust", default-features = false, features = ["std"] }
nginx-sys = { path = "../../../vendor/ngx-rust/nginx-sys", default-features = false, features = ["http"] }

[features]
default = ["export-modules"]
export-modules = []
# Negative gate only: NGINX must reject this deliberately incompatible fixture.
abi-mismatch-fixture = []

[lints]
workspace = true
