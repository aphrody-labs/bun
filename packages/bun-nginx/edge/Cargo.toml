[package]
name = "bun-edge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Axum origin behind bun:nginx: static roots, signed object-store manifest origin and dynamic proxy"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bun-edge"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
percent-encoding = "2"
url = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
