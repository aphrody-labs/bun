# Its own workspace: not a member of the Bun workspace at the repository root.
# aphrody-oxc-bridge is published to crates.io; crates/oxc-tools (linter, formatter) and crates/napi
# (the addon behind @aphrody/bun-plugin-oxc) are not published.
#
# Oxc is pinned to the aphrody-labs/oxc fork, branch `aphrody`: tag oxlint_v1.87.0 (crates 0.153.0,
# oxlint 1.87.0, oxfmt 0.72.0) plus the patch exposing oxfmt's core API. oxc_linter and oxfmt are not on
# crates.io; local paths and [patch.crates-io] use the exact vendor/oxc source receipt.
# One copy of the AST, allocator and semantic crates is linked.
[workspace]
resolver = "3"
members = ["crates/oxc-bridge", "crates/oxc-tools", "crates/napi"]

[workspace.package]
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/bun"
homepage = "https://github.com/aphrody-labs/bun/tree/main/packages/bun-oxc"

[workspace.dependencies]
aphrody-oxc-bridge = { path = "crates/oxc-bridge", version = "=1.4.4" }
aphrody-oxc-tools = { path = "crates/oxc-tools" }

oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_codegen = "0.153.0"
oxc_diagnostics = "0.153.0"
oxc_isolated_declarations = "0.153.0"
oxc_minifier = "0.153.0"
oxc_parser = "0.153.0"
oxc_semantic = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
oxc_transformer = "0.153.0"
oxc_resolver = "11.24.3"
oxc_parser_napi = "0.153.0"
oxc_transform_napi = "0.153.0"
oxc_minify_napi = "0.153.0"
oxc_linter = { path = "../../vendor/oxc/crates/oxc_linter", features = ["ruledocs"] }
oxfmt = { path = "../../vendor/oxc/apps/oxfmt", default-features = false }
serde_json = "1.0.151"

[patch.crates-io]
oxc = { path = "../../vendor/oxc/crates/oxc" }
oxc_allocator = { path = "../../vendor/oxc/crates/oxc_allocator" }
oxc_ast = { path = "../../vendor/oxc/crates/oxc_ast" }
oxc_ast_macros = { path = "../../vendor/oxc/crates/oxc_ast_macros" }
oxc_ast_visit = { path = "../../vendor/oxc/crates/oxc_ast_visit" }
oxc_cfg = { path = "../../vendor/oxc/crates/oxc_cfg" }
oxc_codegen = { path = "../../vendor/oxc/crates/oxc_codegen" }
oxc_compat = { path = "../../vendor/oxc/crates/oxc_compat" }
oxc_data_structures = { path = "../../vendor/oxc/crates/oxc_data_structures" }
oxc_diagnostics = { path = "../../vendor/oxc/crates/oxc_diagnostics" }
oxc_ecmascript = { path = "../../vendor/oxc/crates/oxc_ecmascript" }
oxc_estree = { path = "../../vendor/oxc/crates/oxc_estree" }
oxc_estree_tokens = { path = "../../vendor/oxc/crates/oxc_estree_tokens" }
oxc_isolated_declarations = { path = "../../vendor/oxc/crates/oxc_isolated_declarations" }
oxc_jsdoc = { path = "../../vendor/oxc/crates/oxc_jsdoc" }
oxc_mangler = { path = "../../vendor/oxc/crates/oxc_mangler" }
oxc_minifier = { path = "../../vendor/oxc/crates/oxc_minifier" }
oxc_minify_napi = { path = "../../vendor/oxc/napi/minify" }
oxc_napi = { path = "../../vendor/oxc/crates/oxc_napi" }
oxc_parser = { path = "../../vendor/oxc/crates/oxc_parser" }
oxc_parser_napi = { path = "../../vendor/oxc/napi/parser" }
oxc_regular_expression = { path = "../../vendor/oxc/crates/oxc_regular_expression" }
oxc_semantic = { path = "../../vendor/oxc/crates/oxc_semantic" }
oxc_span = { path = "../../vendor/oxc/crates/oxc_span" }
oxc_str = { path = "../../vendor/oxc/crates/oxc_str" }
oxc_syntax = { path = "../../vendor/oxc/crates/oxc_syntax" }
oxc_transform_napi = { path = "../../vendor/oxc/napi/transform" }
oxc_transformer = { path = "../../vendor/oxc/crates/oxc_transformer" }
oxc_transformer_plugins = { path = "../../vendor/oxc/crates/oxc_transformer_plugins" }
oxc_traverse = { path = "../../vendor/oxc/crates/oxc_traverse" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"
