# Its own workspace: not a member of the Bun workspace at the repository root.
# aphrody-oxc-bridge is published to crates.io; crates/oxc-tools (linter, formatter) and crates/napi
# (the addon behind @aphrody/bun-plugin-oxc) are not published.
#
# Oxc is pinned to the aphrody-labs/oxc fork, branch `aphrody`: tag oxlint_v1.87.0 (crates 0.153.0,
# oxlint 1.87.0, oxfmt 0.72.0) plus the patch exposing oxfmt's core API. oxc_linter and oxfmt are not on
# crates.io, so they come from git, and [patch.crates-io] points every published oxc_* crate at the same
# revision: one copy of the AST, allocator and semantic crates is linked.
[workspace]
resolver = "3"
members = ["crates/oxc-bridge", "crates/oxc-tools", "crates/napi"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/bun"
homepage = "https://github.com/aphrody-labs/bun/tree/main/packages/bun-oxc"

[workspace.dependencies]
aphrody-oxc-bridge = { path = "crates/oxc-bridge", version = "=0.3.0" }
aphrody-oxc-tools = { path = "crates/oxc-tools" }

oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_codegen = "0.153.0"
oxc_diagnostics = "0.153.0"
oxc_isolated_declarations = "0.153.0"
oxc_minifier = "0.153.0"
oxc_parser = "0.153.0"
oxc_semantic = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
oxc_transformer = "0.153.0"
oxc_resolver = "11.24.3"
oxc_parser_napi = "0.153.0"
oxc_transform_napi = "0.153.0"
oxc_minify_napi = "0.153.0"
oxc_linter = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624", features = ["ruledocs"] }
oxfmt = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624", default-features = false }
serde_json = "1.0.151"

[patch.crates-io]
oxc = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_allocator = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_ast = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_ast_macros = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_ast_visit = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_cfg = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_codegen = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_compat = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_data_structures = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_diagnostics = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_ecmascript = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_estree = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_estree_tokens = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_isolated_declarations = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_jsdoc = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_mangler = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_minifier = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_minify_napi = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_napi = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_parser = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_parser_napi = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_regular_expression = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_semantic = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_span = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_str = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_syntax = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_transform_napi = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_transformer = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_transformer_plugins = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }
oxc_traverse = { git = "https://github.com/aphrody-labs/oxc", rev = "b25696441c80fd580c35d671797f1940c642a624" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"
