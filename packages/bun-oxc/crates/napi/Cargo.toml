[package]
name = "bun-plugin-oxc-napi"
description = "Node-API addon and native onBeforeParse plugin behind @aphrody/bun-plugin-oxc."
edition = "2021"
publish = false

[package.version]
workspace = true

[package.rust-version]
workspace = true

[package.license]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3"

[dependencies.bun_ecma_api]
workspace = true

[dependencies.bun_quality]
workspace = true

[dependencies.bun-native-plugin]
path = "../../../bun-native-plugin-rs"

[dependencies.napi]
version = "3"
default-features = false
features = ["napi4", "serde-json"]

[dependencies.oxc_parser_napi]
workspace = true
features = ["tokens"]

[dependencies.oxc_transform_napi]
workspace = true

[dependencies.oxc_minify_napi]
workspace = true

[dependencies.serde_json]
version = "1.0.151"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
