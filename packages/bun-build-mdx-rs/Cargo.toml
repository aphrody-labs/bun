[package]
edition = "2021"
name = "bun-mdx-rs"
publish = false
version = "1.4.6"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.12.2", default-features = false, features = ["napi4"] }
napi-derive = "2.12.2"
mdxjs = "1.0.4"
bun-native-plugin = { path = "../bun-native-plugin-rs" }

[build-dependencies]
napi-build = "2.0.1"

[lints]
workspace = true
