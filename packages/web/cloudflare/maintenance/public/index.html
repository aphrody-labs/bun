<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rose Griffon — Maintenance</title>
    <meta name="description" content="Le site Rose Griffon est en maintenance suite à une mise à jour majeure." />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#a14b3f" />
    <link rel="icon" href="/logo.webp" type="image/webp" />
    <link rel="preload" as="image" href="/bg.webp" />
    <style>
      :root {
        --accent: #a14b3f;
        --accent-soft: #c76a5c;
        --text: #f5e9e6;
        --muted: #d4bdb6;
        --stroke: rgba(161, 75, 63, 0.35);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        position: relative;
        isolation: isolate;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background: url("/bg.webp") center/cover no-repeat;
        background-attachment: fixed;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(ellipse at 20% 20%, rgba(161, 75, 63, 0.35), transparent 55%),
          radial-gradient(ellipse at 80% 80%, rgba(199, 106, 92, 0.3), transparent 50%),
          linear-gradient(135deg, rgba(10, 4, 3, 0.78) 0%, rgba(26, 10, 7, 0.88) 100%);
      }
      .card {
        max-width: 560px;
        width: 100%;
        padding: 3.5rem 2.5rem;
        text-align: center;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        border: 1px solid var(--stroke);
        border-radius: 24px;
        backdrop-filter: blur(22px) saturate(160%);
        -webkit-backdrop-filter: blur(22px) saturate(160%);
        box-shadow:
          0 30px 80px -20px rgba(0, 0, 0, 0.7),
          0 0 80px -20px rgba(161, 75, 63, 0.45);
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .logo-wrap {
        display: inline-flex;
        padding: 1rem;
        margin-bottom: 1.75rem;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(161, 75, 63, 0.3), transparent 70%);
        animation: pulse 3.5s ease-in-out infinite;
      }
      .logo {
        width: 140px;
        height: 140px;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(161, 75, 63, 0.6));
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #fff 0%, var(--accent-soft) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        font-size: 0.95rem;
        color: var(--muted);
        margin-bottom: 1.5rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p.message {
        font-size: clamp(1rem, 2vw, 1.125rem);
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 2rem;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        font-size: 0.875rem;
        color: var(--muted);
        background: rgba(161, 75, 63, 0.12);
      }
      .invite {
        font-size: 0.95rem;
        color: var(--muted);
        margin-top: -0.5rem;
        margin-bottom: 0.25rem;
        font-style: italic;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
        animation: blink 1.4s ease-in-out infinite;
      }
      .actions {
        margin-top: 1.75rem;
        display: flex;
        justify-content: center;
      }
      .btn-discord {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        background: #5865f2;
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
        box-shadow: 0 8px 24px -8px rgba(88, 101, 242, 0.7);
      }
      .btn-discord:hover {
        transform: translateY(-1px);
        background: #4752c4;
        box-shadow: 0 12px 28px -8px rgba(88, 101, 242, 0.9);
      }
      .btn-discord svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      .socials {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .social-icon {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--stroke);
        text-decoration: none;
        transition:
          transform 0.15s ease,
          background 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease;
      }
      .social-icon:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border-color: var(--accent);
      }
      .social-icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      footer {
        position: fixed;
        bottom: 1.5rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.8rem;
        color: rgba(212, 189, 182, 0.7);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @media (max-width: 480px) {
        .card {
          padding: 2.5rem 1.5rem;
        }
        .logo {
          width: 100px;
          height: 100px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-wrap,
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
