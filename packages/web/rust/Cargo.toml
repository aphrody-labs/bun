# SPDX-License-Identifier: Apache-2.0
[package]
name = "aphrody-web-source"
version = "1.4.4"
edition = "2024"
license = "Apache-2.0"
description = "Canonical transferred Aphrody web integration sources for Rust consumers"
repository = "https://github.com/aphrody-labs/bun"
build = "build.rs"
include = ["Cargo.toml", "build.rs", "src/**", "tests/**", "integrations/**", "crates/**", "packages/**", "README.md", "transfer-receipt.json"]

[dev-dependencies]
serde_json = { workspace = true }

[workspace]
resolver = "3"
members = ["crates/x", "crates/webos-wasm", "crates/web-service", "crates/web-index", "crates/web-frames", "crates/web-extract", "crates/web-engine", "crates/web-detect", "crates/web-crawl", "crates/site", "crates/obscura-ssrf", "crates/obscura-render", "crates/obscura-net", "crates/obscura-mcp", "crates/obscura-js", "crates/obscura-dom", "crates/obscura-cdp", "crates/obscura-browser", "crates/obscura", "integrations/crates/shell/session", "integrations/crates/shell/vfs", "integrations/crates/shell/terminal-core", "integrations/crates/shell/web"]
exclude = ["crates/dragon-pixel-core", "crates/dragon-pixel-server", "crates/dragon-pixel-wasm"]

[workspace.package]
version = "1.4.4"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/aphrody-labs/bun"
license = "Apache-2.0"
authors = ["aphrody-code"]
homepage = "https://github.com/aphrody-labs/aphrody"
description = "aphrody — the ultimate cross-platform CLI (Linux/Windows/WASM)."
categories = ["command-line-utilities", "development-tools", "web-programming"]
keywords = ["cli", "cross-platform", "rust", "linux", "wasm"]

[workspace.dependencies.ab_glyph]
version = "=0.2.32"

[workspace.dependencies.aes]
version = "=0.9.3"

[workspace.dependencies.aes-gcm]
version = "=0.11.1"
features = []

[workspace.dependencies.anyhow]
version = "=1.0.104"

[workspace.dependencies.aphrody-google]
path = "../../bun-google/aphrody/crates/google"
version = "1.4.4"
features = []

[workspace.dependencies.aphrody-m3-tokens]
version = "1.4.4"
features = []
git = "https://github.com/aphrody-labs/material"
rev = "e858361dfd2597b067eea56d471ff4caab7442f8"

[workspace.dependencies.aphrody-patch]
version = "1.4.4"
features = []
git = "https://github.com/aphrody-labs/aphrody"
rev = "4b83ea7f6c2727d67c30d4942501e5b831e559dd"

[workspace.dependencies.aphrody-proc]
version = "1.4.4"
features = []
git = "https://github.com/aphrody-labs/aphrody"
rev = "4b83ea7f6c2727d67c30d4942501e5b831e559dd"

[workspace.dependencies.aphrody-rag-core]
version = "1.4.4"
features = []
git = "https://github.com/aphrody-labs/aphrody"
rev = "4b83ea7f6c2727d67c30d4942501e5b831e559dd"

[workspace.dependencies.aphrody-re]
package = "bun-re"
version = "=1.0.0-canary"
features = []

[workspace.dependencies.aphrody-shell-session]
path = "integrations/crates/shell/session"
version = "1.4.4"
features = []

[workspace.dependencies.aphrody-shell-vfs]
path = "integrations/crates/shell/vfs"
version = "1.4.4"
features = []

[workspace.dependencies.aphrody-shell-web]
path = "integrations/crates/shell/web"
version = "1.4.4"
features = []

[workspace.dependencies.aphrody-terminal-core]
path = "integrations/crates/shell/terminal-core"
version = "1.4.4"
features = []

[workspace.dependencies.aphrody-web-crawl]
path = "crates/web-crawl"
version = "1.4.4"
features = []

[workspace.dependencies.aphrody-web-extract]
path = "crates/web-extract"
version = "1.4.4"
features = []

[workspace.dependencies.aphrody-web-service]
path = "crates/web-service"
version = "1.4.4"
features = []

[workspace.dependencies.async-trait]
version = "=0.1.92"

[workspace.dependencies.axum]
version = "=0.8.9"
default-features = false
features = ["json", "query", "tokio", "http1", "http2"]

[workspace.dependencies.base64]
version = "=0.23.1"

[workspace.dependencies.blake3]
version = "=1.8.7"

[workspace.dependencies.chrono]
