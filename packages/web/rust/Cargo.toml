[workspace.dependencies.image]
version = "=0.25.10"

[workspace.dependencies.json5]
version = "=1.3.1"
features = []

[workspace.dependencies.libc]
version = "=0.2.189"

[workspace.dependencies.log]
version = "=0.4.34"

[workspace.dependencies.memmap2]
version = "=0.9.11"

[workspace.dependencies.obscura]
path = "crates/obscura"
version = "1.4.4"
package = "aphrody-obscura"

[workspace.dependencies.obscura-browser]
path = "crates/obscura-browser"
version = "1.4.4"
features = []

[workspace.dependencies.obscura-cdp]
path = "crates/obscura-cdp"
version = "1.4.4"
features = []

[workspace.dependencies.obscura-dom]
path = "crates/obscura-dom"
version = "1.4.4"
features = []

[workspace.dependencies.obscura-js]
path = "crates/obscura-js"
version = "1.4.4"
