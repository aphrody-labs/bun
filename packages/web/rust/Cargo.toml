default-features = false

[workspace.dependencies.reqwest]
version = "=0.13.5"
features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"]
