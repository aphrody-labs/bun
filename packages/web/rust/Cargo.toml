[workspace.dependencies.tracing]
version = "=0.1.44"

[workspace.dependencies.tracing-subscriber]
version = "=0.3.23"
features = ["env-filter", "fmt", "json", "regex", "registry"]

[workspace.dependencies.ureq]
version = "=3.4.2"
default-features = false
features = ["rustls"]

[workspace.dependencies.url]
version = "=2.5.8"
features = ["serde"]

[workspace.dependencies.uuid]
version = "=1.26.1"
features = ["v4", "v7", "serde"]

[workspace.dependencies.wasm-bindgen]
version = "=0.2.129"

[workspace.dependencies.webp]
version = "=0.3.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.lints.clippy.correctness]
level = "warn"
priority = -1

[workspace.lints.clippy.perf]
level = "warn"
priority = -1
