[package]
name = "yolo-pyo3"
version = "1.0.0"
edition = "2024"
license = "MIT AND Apache-2.0"
authors = ["aphrody-code"]
repository = "https://github.com/aphrody-labs/bun"
description = "PyO3 0.29 Native Extension Module for YOLO Monorepo (Free-threaded, No-GIL, py.detach)"

[lib]
name = "_yolo_native"
crate-type = ["cdylib"]

[dependencies]
yolo-core = { path = "../yolo-core", version = "1.0.0" }
pyo3 = { version = "0.29" }

[lints]
workspace = true
