# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Versioned C ABI of the precompiled YOLO native runtime: system stats, cancellable benchmark, process supervision, HTTP probe"

[lib]
name = "yolo_runtime"
# cdylib: the standalone library loaded by the Bun, .NET and Python bindings of this package.
# rlib: re-exported by aphrody's `aphrody_ffi`.
crate-type = ["cdylib", "rlib"]

# The browser (Obscura/V8) and GPU (wgpu/CUDA) extensions build in aphrody-labs/aphrody, where their
# engines live; this workspace builds the core ABI only.
[features]
default = []

[dependencies]
yolo-core = { path = "../yolo-core", version = "1.0.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Process groups are signalled on Unix; nothing else is pulled in.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
