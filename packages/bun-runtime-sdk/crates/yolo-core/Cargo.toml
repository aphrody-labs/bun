[package]
name = "yolo-core"
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
authors = ["aphrody-code"]
license = "MIT AND Apache-2.0"
repository = "https://github.com/aphrody-labs/bun"
homepage = "https://github.com/aphrody-labs/bun/tree/main/packages/bun-runtime-sdk"
readme = "README.md"
keywords = ["benchmark", "hardware", "system-metrics", "bun", "tauri"]
categories = ["development-tools", "hardware-support"]
description = "Core native engine and system benchmarking logic for YOLO Monorepo"

[dependencies]
rayon = { version = "1.12.0" }
serde = { version = "1.0.229", features = ["derive", "std"], default-features = false }
serde_json = { version = "1.0.151" }

anyhow = { version = "1.0.104", optional = true }
blake3 = { version = "1.8.7", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dashmap = { version = "6", optional = true }
dunce = { version = "1.0.5", optional = true }
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.6", optional = true }
parking_lot = { version = "0.12.5", optional = true }
tracing = { version = "0.1.44", optional = true }
globset = { version = "0.4", optional = true }
ignore = { version = "0.4", optional = true }
regex = { version = "1.11", optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
oxc_allocator = { package = "bun_arena", path = "../../../../src/collections/arena", version = "0.153.0", optional = true }
oxc_parser = { package = "bun_ecma_parser", path = "../../../../src/js_parser/ecma", version = "0.153.0", optional = true }
oxc_span = { package = "bun_ecma_span", path = "../../../../src/ast/span", version = "0.153.0", optional = true }
oxc_ast = { package = "bun_ecma_ast", path = "../../../../src/ast/ecma", version = "0.153.0", optional = true }
oxc_ast_visit = { package = "bun_ecma_ast_visit", path = "../../../../src/ast/visit", version = "0.153.0", optional = true }

[dev-dependencies]
tempfile = { version = "3.27.0" }

[features]
default = []
repository-tools = ["dep:anyhow", "dep:blake3", "dep:chrono", "dep:dashmap", "dep:dunce", "dep:notify", "dep:notify-debouncer-full", "dep:parking_lot", "dep:tracing", "dep:globset", "dep:ignore", "dep:regex", "dep:tokio", "dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_span", "dep:oxc_ast", "dep:oxc_ast_visit"]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.189" }

[lints]
workspace = true
