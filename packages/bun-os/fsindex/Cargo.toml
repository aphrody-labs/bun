# Absorbed from aphrody-labs/aphrody@5b36d40c6c (crates/os/kernel/libs/fsindex, aphrody-fsindex).
# Absorbed from aphrody-labs/aphrody@5b36d40c6c (crates/os/kernel/libs/fsindex).
[package]
publish = false
name = "bun-fsindex"
version = "1.0.0-canary"
edition.workspace      = true
rust-version.workspace = true
repository.workspace   = true
license.workspace      = true
description            = "Persistent local-filesystem search index (SQLite FTS5), mirroring the Google desktop app's local_files.db. Metadata-only, privacy-bounded."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
thiserror  = { workspace = true }
walkdir    = { workspace = true }
# Bundled libsqlite3 (FTS5 enabled) — shares the workspace-pinned rusqlite +
# single `links = "sqlite3"` with aphrody-memory / cli forensics.
rusqlite   = { workspace = true }

[target.'cfg(windows)'.dependencies]
# NTFS MFT/USN controls (`ntfs_win`); the Everything SDK binding lives in `everything_sdk`.
windows    = { workspace = true, features = ["Win32_Foundation", "Win32_System_Ioctl", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile   = { workspace = true }

[package.metadata.cargo-machete]
ignored = []
