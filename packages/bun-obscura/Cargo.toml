# SPDX-License-Identifier: Apache-2.0
# Obscura engine owner; independent from the Bun executable workspace.
[workspace]
resolver = "3"
members = ["crates/obscura", "crates/obscura-browser", "crates/obscura-cdp", "crates/obscura-dom", "crates/obscura-js", "crates/obscura-mcp", "crates/obscura-net", "crates/obscura-render", "crates/obscura-ssrf", "crates/web-extract", "crates/taffy"]

[workspace.package]
"version" = "1.4.4"
"edition" = "2024"
"rust-version" = "1.97"
"repository" = "https://github.com/aphrody-labs/bun-os"
"license" = "Apache-2.0"
"authors" = ["aphrody-code"]
"homepage" = "https://github.com/aphrody-labs/bun-os"
"description" = "aphrody — the ultimate cross-platform CLI (Linux/Windows/WASM)."
"categories" = ["command-line-utilities", "development-tools", "web-programming"]
"keywords" = ["cli", "cross-platform", "rust", "linux", "wasm"]

[workspace.dependencies]
"ab_glyph" = "0.2.32"
"aes" = { "version" = "0.9.3" }
"aes-gcm" = { "version" = "0.11", "features" = [] }
"anyhow" = "1.0.104"
"aphrody-web-extract" = { "path" = "crates/web-extract", "version" = "1.4.4", "features" = [] }
"async-trait" = "0.1.92"
"base64" = "0.23.1"
"chrono" = { "version" = "0.4", "features" = ["serde"] }
"cookie" = "=0.18.2"
"encoding_rs" = "0.8.41"
"futures" = "0.3.34"
"futures-util" = { "version" = "0.3", "features" = [] }
"getrandom" = { "version" = "0.4" }
"html5ever" = { "version" = "0.40", "features" = [] }
"libc" = "0.2.189"
"log" = "0.4.34"
"obscura-browser" = { "path" = "crates/obscura-browser", "version" = "1.4.4", "features" = [] }
"obscura-dom" = { "path" = "crates/obscura-dom", "version" = "1.4.4", "features" = [] }
"obscura-js" = { "path" = "crates/obscura-js", "version" = "1.4.4", "features" = [] }
"obscura-net" = { "path" = "crates/obscura-net", "version" = "1.4.4", "features" = [] }
"obscura-render" = { "path" = "crates/obscura-render", "version" = "1.4.4", "features" = [] }
"obscura-ssrf" = { "path" = "crates/obscura-ssrf", "version" = "1.4.4", "features" = [] }
"rcgen" = { "version" = "0.14", "default-features" = false, "features" = ["crypto", "pem", "ring"] }
"regex" = { "version" = "1.11", "features" = [] }
"reqwest" = { "version" = "0.13.5", "features" = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], "default-features" = false }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["ring", "std", "tls12"] }
"serde" = { "version" = "1.0.229", "features" = ["derive", "std"], "default-features" = false }
"serde_json" = "1.0.151"
"sha1" = { "version" = "0.11.0" }
"sha2" = "0.11.0"
"tempfile" = "3.27.0"
"thiserror" = "2.0.20"
"tokio" = { "version" = "1.53.1", "features" = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"] }
"tokio-tungstenite" = { "version" = "0.30", "features" = [] }
"tracing" = "0.1.44"
"ureq" = { "version" = "3", "default-features" = false, "features" = ["rustls"] }
"url" = { "version" = "2.5.8", "features" = ["serde"] }
"uuid" = { "version" = "1.26.0", "features" = ["v4", "v7", "serde"] }

[workspace.lints.rust]
"unsafe_op_in_unsafe_fn" = "deny"
"unused_must_use" = "deny"
"non_ascii_idents" = "deny"

[workspace.lints.clippy]
"todo" = "deny"
"unimplemented" = "deny"
"dbg_macro" = "deny"
"correctness" = { "level" = "warn", "priority" = -1 }
"perf" = { "level" = "warn", "priority" = -1 }
