# SPDX-License-Identifier: Apache-2.0
# External native Python components: deliberately not linked into Bun's engine.
[workspace]
resolver = "3"
members = ["crates/bun-python-host", "crates/aphrody-rust"]
default-members = ["crates/bun-python-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun"

[workspace.dependencies]
pyo3 = "=0.29.3"
# Product algorithms stay with their capability owner; only the Python adapter moves.
aphrody-rag-core = { git = "https://github.com/aphrody-labs/aphrody", rev = "c58e93d6dc1b4b2d420c3c929a40c67dd071d2f4", default-features = false }

[profile.release]
panic = "unwind"

# PyO3 comes from the aphrody-labs fork, same pin as packages/buv/vendor.json.
[patch.crates-io]
pyo3 = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-build-config = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-ffi = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-macros = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-macros-backend = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
