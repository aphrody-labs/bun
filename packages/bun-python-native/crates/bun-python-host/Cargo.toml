# SPDX-License-Identifier: Apache-2.0
[package]
name = "bun-python-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun"
description = "Lazy shared CPython host and compatibility C ABI for the Bun fork"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[lints]
workspace = true
