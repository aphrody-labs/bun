# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bun-native-build"
version = "0.1.0"
description = "Python product build backend using pinned native workspaces from the Bun fork"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["maturin==1.14.1"]

[tool.hatch.build.targets.wheel]
packages = ["bun_native_build"]
