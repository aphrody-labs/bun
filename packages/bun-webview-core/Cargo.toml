[package]
name = "bun-webview-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false
repository = "https://github.com/aphrody-labs/bun"
description = "Native webview layer shared by Bun.WebView (bun-webview-host, CDP over a pipe) and the Aphrody Tauri runtimes: WebKitGTK (GTK4/webkitgtk-6.0 or GTK3/webkit2gtk-4.1), WebView2, WKWebView, CEF."

# Not a member of Bun's workspace: its own workspace and lockfile, like packages/bun-cosmic and
# packages/bun-re. The GUI stacks (gtk4/webkit6, wry, webview2-com, cef) are never linked into bun:
# Bun.WebView spawns `bun-webview-host` on the first `new Bun.WebView({ backend: "webkitgtk" | ... })`
# and drives it with the same CDP pipe protocol it uses for Chrome (ChromeBackend.cpp).
# Rust consumers (aphrody-tauri-runtime-*) depend on it with
# `bun-webview-core = { git = "https://github.com/aphrody-labs/bun" }`.
[workspace]

[lib]
name = "bun_webview_core"
path = "src/lib.rs"

[[bin]]
name = "bun-webview-host"
path = "src/main.rs"

[features]
default = ["gtk4"]
# Linux: WebKitGTK on GTK4 (webkitgtk-6.0). Never pulls GTK3.
gtk4 = ["dep:webkit6"]
# Linux: WebKitGTK on GTK3 (webkit2gtk-4.1) through the aphrody-labs/wry fork. Exclusive with gtk4 at build time.
gtk3 = ["wry"]
# WebView2 (Windows), WKWebView (macOS) and WebKitGTK-GTK3 (Linux) through the aphrody-labs/wry fork.
wry = ["dep:wry"]

[dependencies]
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit6 = { version = "0.6", optional = true }

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
wry = { git = "https://github.com/aphrody-labs/wry", branch = "dev", optional = true, default-features = false, features = ["os-webview"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
