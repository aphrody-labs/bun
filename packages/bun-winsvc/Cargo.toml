[package]
name = "bun-winsvc"
version = "1.4.7"
edition = "2021"
publish = false
description = "Windows service host for the Bun fork: runs a command (bun.exe ...) as a service, restarts it and stops its process tree"

[dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true
