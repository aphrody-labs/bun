[profile.release.package.bun_react_compiler]
opt-level = "s"

# The runners behind `--run-typescript-tests`, `--run-prettier-tests` and `--run-eslint-tests`. Only canary and debug
# builds have them, and the time goes into what they test, which keeps its own level.
[profile.release.package.bun_sema_baselines]
opt-level = "z"

[profile.release.package.bun_format_conformance]
opt-level = "z"

[profile.release.package.bun_lint_conformance]
opt-level = "z"

# Fork subsystems reached only from their own cold commands (`bun uv`/`uvx`, `bun vpn`, `bun winmd`, GitHub
# release tooling): they are a quarter of the binary and none of them runs during startup or a hot loop.
[profile.release.package.octocrab]
opt-level = "z"

[profile.release.package.quinn]
opt-level = "s"

[profile.release.package.quinn-proto]
opt-level = "s"

[profile.release.package.quinn-udp]
opt-level = "s"

# The hyper/reqwest client stack serves only cold subsystems: bun's own HTTP is uSockets.
[profile.release.package.hyper]
opt-level = "s"

[profile.release.package.hyper-util]
opt-level = "s"

[profile.release.package.h2]
opt-level = "s"

[profile.release.package.reqwest]
opt-level = "s"

[profile.release.package.tower]
opt-level = "s"

# Cold CLI subsystems of the fork: `bun mcp`, `bun n2b` migration, crawling,
# MSVC/.NET discovery, SBOM export.
[profile.release.package.bun_migrate]
opt-level = "z"

[profile.release.package.bun_mcp]
opt-level = "z"

[profile.release.package.find-msvc-tools]
opt-level = "z"

[profile.release.package.bun-dotnet-host]
opt-level = "z"

[profile.release.package.aphrody-jev]
opt-level = "z"

[profile.release.package.bun_agent_tools]
opt-level = "z"

[profile.release.package.bun_browser_crawl]
opt-level = "z"

[profile.release.package.bun_browser_net]
opt-level = "z"

[patch.crates-io]
# zlib-rs is absorbed in src/zlib_rs; every crate shares it.
zlib-rs = { path = "src/zlib_rs" }
# PyO3 comes from the aphrody-labs fork, same pin as packages/buv/vendor.json.
pyo3 = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-build-config = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-ffi = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-macros = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
pyo3-macros-backend = { git = "https://github.com/aphrody-labs/pyo3", rev = "451d99fdcdcddf159e8e0a1186960b332cdb5d7c" }
swc_common = { path = "packages/bun-build-mdx-rs/swc_common" }


