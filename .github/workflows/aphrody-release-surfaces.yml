name: Generate release source surfaces
on:
  workflow_dispatch:
  push:
    tags: ["bun-v*", "aphrody-v*"]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Mount bun-ui (optional submodule of aphrody-labs/bun-ui)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout packages/bun-ui
          bun install --frozen-lockfile --cwd packages/bun-ui
      - name: Install the site build dependencies (React, Tailwind, fonts)
        run: bun install --frozen-lockfile --filter @aphrody/web
      - name: Generate immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:surfaces --repo "${{ github.repository }}" --out "$RUNNER_TEMP/release-surfaces"
      - uses: actions/upload-artifact@v6
        with:
          name: release-surfaces-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-surfaces/README.md
            ${{ runner.temp }}/release-surfaces/github.json
            ${{ runner.temp }}/release-surfaces/manifest.json
            ${{ runner.temp }}/release-surfaces/monorepo.sqlite
            ${{ runner.temp }}/release-surfaces/graph.json
            ${{ runner.temp }}/release-surfaces/graph-docs
            ${{ runner.temp }}/release-surfaces/releases.json
            ${{ runner.temp }}/release-surfaces/site-data.json
            ${{ runner.temp }}/release-surfaces/plugin
            ${{ runner.temp }}/release-surfaces/bun-agent-plugin.bin
            ${{ runner.temp }}/release-surfaces/site
