name: Publish Bun OS crates

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum crates to publish in this run
        type: string
        default: "5"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: publish-bun-os-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aphrody-labs/bun-distribution
          ref: os
          token: ${{ secrets.APHRODY_SYNC_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          token: ${{ secrets.APHRODY_SYNC_TOKEN }}
          rust: "true"
      - name: Publish the unpublished crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bun scripts/release.ts crates --apply --limit "${{ inputs.limit || '5' }}" --pause 600
