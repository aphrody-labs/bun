name: Aphrody npm publish

# Publishes the fork's JS packages (@aphrody/bun-types, inspector and debug
# adapter protocols, svelte, yaml and tailwind plugins, next-bun) with
# scripts/aphrody/publish-npm.ts. Versions are `<base>-aphrody.<n>`; a package
# whose content matches its newest published version is skipped, so re-running
# is safe.

permissions:
  contents: read

on:
  push:
    tags:
      - "aphrody-v*"
      - "bun-v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and compute versions without publishing
        type: boolean
        default: false
      only:
        description: Comma-separated package directories to publish (default all)
        type: string
        default: ""
      qualification-tag:
        description: Exact-source runtime release carrying all eight native full receipts
        type: string
        default: ""

concurrency:
  group: aphrody-publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mount Bun Video (optional submodule of aphrody-labs/bun-video)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout --recursive packages/bun-video
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - name: Resolve committed workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test publish script
        run: bun test ./test/internal/aphrody-publish-npm.test.ts ./scripts/aphrody/release-portable-npm.test.ts
      - name: Select exact publication qualification
        id: qualification
        env:
          ONLY: ${{ inputs.only }}
        run: |
          route=$(bun scripts/aphrody/release-portable-npm.ts route --only "$ONLY")
          printf 'kind=%s\n' "$route" >> "$GITHUB_OUTPUT"
          printf 'plugin=%s\n' "$(bun scripts/aphrody/release-portable-npm.ts contains-plugin --only "$ONLY")" >> "$GITHUB_OUTPUT"
          printf 'runtime-version=%s\n' "$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" >> "$GITHUB_OUTPUT"
      - name: Qualify exact portable source archives and consumers
        id: portable
        if: inputs.dry-run != true && steps.qualification.outputs.kind == 'portable-source'
        env:
          ONLY: ${{ inputs.only }}
        run: |
          stable=""; case "$GITHUB_REF_NAME" in bun-v*) stable="--stable";; esac
          bun scripts/aphrody/release-portable-npm.ts qualify --only "$ONLY" --source "$GITHUB_SHA" --out "$RUNNER_TEMP/portable-npm" $stable
      - name: Retain portable source qualification evidence
        if: always() && inputs.dry-run != true && steps.qualification.outputs.kind == 'portable-source'
        uses: actions/upload-artifact@v6
        with:
          name: portable-npm-source-qualification
          path: ${{ runner.temp }}/portable-npm
          if-no-files-found: error
      - name: Verify eight native full release receipts before publication
        if: inputs.dry-run != true && steps.qualification.outputs.kind != 'portable-source' && steps.qualification.outputs.kind != 'plugin-source'
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
          QUALIFICATION_TAG: ${{ inputs.qualification-tag || github.ref_name }}
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          channel=candidate; case "$QUALIFICATION_TAG" in bun-v*) channel=stable;; esac
          bun scripts/aphrody/release-aggregation.ts download-verify "$QUALIFICATION_TAG" "$RUNNER_TEMP/full-qualification" "$GITHUB_SHA" "$version" "$channel"
      - name: Setup exact-source plugin runtime
        if: inputs.dry-run != true && steps.qualification.outputs.plugin == 'true'
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ steps.qualification.outputs.runtime-version }}
          expected-source: ${{ github.sha }}
      - name: Qualify exact plugin source, archive, consumer and native MCP
        id: plugin
        if: inputs.dry-run != true && steps.qualification.outputs.plugin == 'true'
        run: |
          stable=""; case "$GITHUB_REF_NAME" in bun-v*) stable="--stable";; esac
          bun scripts/aphrody/release-portable-npm.ts qualify-plugin --only bun-agent-plugin --source "$GITHUB_SHA" --out "$RUNNER_TEMP/plugin-npm" $stable
      - name: Retain plugin source qualification evidence
        if: always() && inputs.dry-run != true && steps.qualification.outputs.plugin == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: plugin-npm-source-qualification
          path: ${{ runner.temp }}/plugin-npm
          if-no-files-found: error
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          ONLY: ${{ inputs.only }}
          QUALIFICATION_KIND: ${{ steps.qualification.outputs.kind }}
          INCLUDES_PLUGIN: ${{ steps.qualification.outputs.plugin }}
        run: |
          auth_config=$(mktemp "$RUNNER_TEMP/aphrody-npmrc.XXXXXX")
          cleanup_auth() {
            if [ -L "$HOME/.npmrc" ] && [ "$(readlink "$HOME/.npmrc")" = "$auth_config" ]; then
              rm -- "$HOME/.npmrc"
            fi
            rm -- "$auth_config"
          }
          trap cleanup_auth EXIT
          chmod 600 "$auth_config"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$auth_config"
          test ! -e "$HOME/.npmrc" && test ! -L "$HOME/.npmrc"
          ln -s "$auth_config" "$HOME/.npmrc"
          stable=""; case "$GITHUB_REF_NAME" in bun-v*) stable="--stable";; esac
          portable_receipt=""
          if [ "$QUALIFICATION_KIND" = portable-source ] && [ -z "$DRY_RUN" ]; then
            portable_receipt="$RUNNER_TEMP/portable-npm/portable-npm-qualification.json"
          fi
          plugin_receipt=""
          if [ "$INCLUDES_PLUGIN" = true ] && [ -z "$DRY_RUN" ]; then
            plugin_receipt="$RUNNER_TEMP/plugin-npm/plugin-npm-qualification.json"
          fi
          bun scripts/aphrody/publish-npm.ts $DRY_RUN $stable ${ONLY:+--only "$ONLY"} ${portable_receipt:+--portable-qualification "$portable_receipt"} ${plugin_receipt:+--plugin-qualification "$plugin_receipt"} --out "$RUNNER_TEMP/aphrody-npm"
          # A first publish of a new name leaves an npm 0.0.0-stage placeholder; deprecate it.
          bun scripts/aphrody/npm-placeholder.ts retire $DRY_RUN
