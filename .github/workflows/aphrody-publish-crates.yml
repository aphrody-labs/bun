name: Aphrody publish crates

# Publishes to crates.io with scripts/aphrody/publish-crates.ts: the native
# plugin SDK as aphrody-bun-macro and aphrody-bun-native-plugin, and the
# fork-only workspaces packages/bun-n2b (aphrody-n2b-types, -registry, -core,
# aphrody-n2b) and packages/bun-oxc (aphrody-oxc-bridge). Versions already on
# crates.io are skipped, so re-running is a no-op.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Package and verify only, do not upload"
        type: boolean
        default: false
      only:
        description: "Comma-separated subset: sdk, packages/bun-n2b, packages/bun-oxc (empty: all)"
        type: string
        default: ""
  push:
    tags:
      - "aphrody-v*"

concurrency:
  group: aphrody-publish-crates
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--out "$RUNNER_TEMP/aphrody-crates")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "${{ inputs.dry-run }}" != "true" ]; then args+=(--publish); fi
          bun scripts/aphrody/publish-crates.ts "${args[@]}"
