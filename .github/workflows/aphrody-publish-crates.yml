name: Aphrody publish crates

# Publishes the native plugin SDK to crates.io as aphrody-bun-macro and
# aphrody-bun-native-plugin (scripts/aphrody/publish-crates.ts). Versions
# already on crates.io are skipped, so re-running is a no-op.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Package and verify only, do not upload"
        type: boolean
        default: false
  push:
    tags:
      - "aphrody-v*"

concurrency:
  group: aphrody-publish-crates
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            bun scripts/aphrody/publish-crates.ts --out "$RUNNER_TEMP/aphrody-crates"
          else
            bun scripts/aphrody/publish-crates.ts --publish --out "$RUNNER_TEMP/aphrody-crates"
          fi
