name: Aphrody publish crates

# Publishes to crates.io with scripts/aphrody/publish-crates.ts: the native
# plugin SDK as aphrody-bun-macro and aphrody-bun-native-plugin, and the
# registered browser and Google SDK crates. Internal Oxc, quality and N2B
# owners are not published. Versions already on
# crates.io are skipped, so re-running is a no-op.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Package and verify only, do not upload"
        type: boolean
        default: false
      only:
        description: "Subset: sdk, src/browser/crates/ssrf, crates/aphrody-jev (empty: all)"
        type: string
        default: ""
      qualification-tag:
        description: Exact-source runtime release carrying all eight native full receipts
        type: string
        default: ""
  push:
    tags:
      - "aphrody-v*"
      - "bun-v*"

concurrency:
  group: aphrody-publish-crates
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mount Bun Video (optional submodule of aphrody-labs/bun-video)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout --recursive packages/bun-video
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Prepare pinned Rust workspace sources for portable qualification
        if: inputs.only == 'crates/aphrody-jev' || inputs.only == 'src/browser/crates/ssrf'
        run: |
          bun -e '
            import { provisionRustDependencies } from "./scripts/aphrody/native-ci.ts";
            await provisionRustDependencies(process.cwd(), async command => {
              const child = Bun.spawn(command, { stdout: "inherit", stderr: "inherit" });
              return child.exited;
            });
          '
      - name: Qualify the exact portable Rust crate selection
        if: inputs.only == 'crates/aphrody-jev' || inputs.only == 'src/browser/crates/ssrf'
        env:
          PORTABLE_SELECTION: ${{ inputs.only }}
        run: bun scripts/aphrody/release-portable-crate.ts qualify "$RUNNER_TEMP/portable-crate" "$GITHUB_SHA" "$PORTABLE_SELECTION"
      - name: Verify portable source and package evidence before publication
        if: inputs.only == 'crates/aphrody-jev' || inputs.only == 'src/browser/crates/ssrf'
        env:
          PORTABLE_SELECTION: ${{ inputs.only }}
        run: bun scripts/aphrody/release-portable-crate.ts verify "$RUNNER_TEMP/portable-crate" "$GITHUB_SHA" "$PORTABLE_SELECTION"
      - name: Preserve portable qualification evidence
        if: always() && (inputs.only == 'crates/aphrody-jev' || inputs.only == 'src/browser/crates/ssrf')
        uses: actions/upload-artifact@v6
        with:
          name: portable-${{ inputs.only == 'crates/aphrody-jev' && 'aphrody-jev' || 'browser' }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/portable-crate/*.json
            ${{ runner.temp }}/portable-crate/*.crate
            ${{ runner.temp }}/portable-crate/*.log
            ${{ runner.temp }}/portable-crate/consumer/**
            ${{ runner.temp }}/portable-crate/packages/**
          if-no-files-found: error
      - name: Verify eight native full release receipts before publication
        if: inputs.dry-run != true && inputs.only != 'crates/aphrody-jev' && inputs.only != 'src/browser/crates/ssrf'
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
          QUALIFICATION_TAG: ${{ inputs.qualification-tag || github.ref_name }}
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          channel=candidate; case "$QUALIFICATION_TAG" in bun-v*) channel=stable;; esac
          bun scripts/aphrody/release-aggregation.ts download-verify "$QUALIFICATION_TAG" "$RUNNER_TEMP/full-qualification" "$GITHUB_SHA" "$version" "$channel"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--out "$RUNNER_TEMP/aphrody-crates")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$ONLY" = crates/aphrody-jev ] || [ "$ONLY" = src/browser/crates/ssrf ]; then args+=(--portable-qualification "$RUNNER_TEMP/portable-crate"); fi
          if [ "${{ inputs.dry-run }}" != "true" ]; then args+=(--publish); fi
          bun scripts/aphrody/publish-crates.ts "${args[@]}"
