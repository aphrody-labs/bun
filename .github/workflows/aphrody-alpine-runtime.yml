name: Aphrody Alpine runtime image

# Builds scripts/aphrody/alpine/runtime.Dockerfile natively on x64 and arm64
# and smoke-tests it (bun --version, bun -e, uid 1000). Pushes
# ghcr.io/aphrody-labs/alpine:3.24-runtime (multi-arch) only on an explicit
# workflow_dispatch with push=true.

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    paths:
      - "scripts/aphrody/alpine/runtime.Dockerfile"
      - ".github/workflows/aphrody-alpine-runtime.yml"
  pull_request:
    paths:
      - "scripts/aphrody/alpine/runtime.Dockerfile"
      - ".github/workflows/aphrody-alpine-runtime.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push ghcr.io/aphrody-labs/alpine:3.24-runtime"
        type: boolean
        default: false

concurrency:
  group: aphrody-alpine-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/aphrody-labs/alpine
  TAG: "3.24-runtime"
  PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.push && 'true' || 'false' }}

jobs:
  build:
    if: github.repository == 'aphrody-labs/bun'
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: >
          docker buildx build --load
          --platform "linux/${{ matrix.platform }}"
          -t "$IMAGE:$TAG-${{ matrix.platform }}"
          -f scripts/aphrody/alpine/runtime.Dockerfile
          scripts/aphrody/alpine
      - name: Smoke test
        run: |
          img="$IMAGE:$TAG-${{ matrix.platform }}"
          docker run --rm "$img" bun --version
          test "$(docker run --rm "$img" bun -e 'console.log(1)')" = 1
          test "$(docker run --rm "$img" id -u):$(docker run --rm "$img" id -g)" = 1000:1000
          docker run --rm "$img" bun -e 'const r = await fetch("https://example.com"); if (!r.ok) process.exit(1)'
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push
        if: env.PUSH == 'true'
        run: docker push "$IMAGE:$TAG-${{ matrix.platform }}"

  manifest:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.push
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-arch tag
        run: docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
