name: Bun Video release

on:
  push:
    tags:
      - "bun-video-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bun-video-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/bun-video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Native type, lint and format checks
        run: bun run check
      - name: Build release library
        env:
          BUN_VIDEO_COMPOSITOR_DIR: ${{ github.workspace }}/packages/bun-video/remotion/packages/compositor-linux-x64-gnu
        run: bun run build:library
      - name: Pack release artifact
        run: bun run pack
      - name: Publish npm next
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" bun publish --access public --tag next
      - name: Upload artifact to Cloudflare R2
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.BUN_VIDEO_R2_BUCKET != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUN_VIDEO_R2_BUCKET: ${{ secrets.BUN_VIDEO_R2_BUCKET }}
        run: |
          bunx wrangler r2 object put "$BUN_VIDEO_R2_BUCKET/bun-video/$GITHUB_REF_NAME/$(basename *.tgz)" --file "$(pwd)/$(basename *.tgz)" --remote
