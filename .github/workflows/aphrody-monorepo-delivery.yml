name: Monorepo dependency and release delivery
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: inventory
        options: [inventory, build, release-check]
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: bun-monorepo-delivery
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Mount bun-ui (optional submodule of aphrody-labs/bun-ui)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout packages/bun-ui
          bun install --frozen-lockfile --cwd packages/bun-ui
      - name: Inspect immutable source, upstreams and published artifacts
        run: |
          git remote add upstream https://github.com/oven-sh/bun.git
          bun run delivery --check-upstream --check-registry --out "$RUNNER_TEMP/delivery.json"
      - uses: actions/upload-artifact@v6
        with:
          name: monorepo-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/delivery.json
  factory:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'inventory'
    runs-on: ubuntu-latest
    needs: inventory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Mount bun-ui (optional submodule of aphrody-labs/bun-ui)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout packages/bun-ui
          bun install --frozen-lockfile --cwd packages/bun-ui
      - name: Execute capacity-qualified dependency graph and owner gates
        env:
          DELIVERY_OPERATION: ${{ inputs.operation }}
        run: |
          docker run --rm --cpus 6 --memory 10g \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v bun-delivery-cargo-registry:/root/.cargo/registry \
            -v bun-delivery-target:/work/target \
            -e DELIVERY_OPERATION \
            ghcr.io/aphrody-labs/alpine:3.24 sh -eu -c '
              mkdir -p /work/tmp/delivery-ci
              bun run delivery --out /work/tmp/delivery-ci/inventory.json
              DELIVERY_FILESYSTEM=$(stat -f -c %T /work)
              export DELIVERY_FILESYSTEM
              bun -e '\''import { freemem } from "node:os"; import { statfsSync } from "node:fs"; const disk = statfsSync("/work"); console.log(JSON.stringify({cpu:6,memoryMiB:10240,availableMemoryMiB:Math.min(10240,Math.floor(freemem()/1048576)),freeDiskMiB:Math.floor(disk.bavail*disk.bsize/1048576),filesystem:process.env.DELIVERY_FILESYSTEM,observedAt:new Date().toISOString()}))'\'' > /work/tmp/delivery-ci/observation.json
              tree=$(git rev-parse HEAD^{tree})
              bun scripts/aphrody/build-host.ts profile --observation /work/tmp/delivery-ci/observation.json --host github-actions --target linux-x64-musl --factory-root /work --heavy-lock /work/tmp/delivery-ci/heavy.lock --source-tree "$tree" > /work/tmp/delivery-ci/profile.json
              snapshot=$(sha256sum /work/tmp/delivery-ci/inventory.json | cut -d " " -f 1)
              bun run delivery --operation "$DELIVERY_OPERATION" --profile /work/tmp/delivery-ci/profile.json --snapshot-hash "$snapshot" --execution-receipt /work/tmp/delivery-ci/execution.json --out /work/tmp/delivery-ci/factory.json --apply
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monorepo-factory-${{ github.sha }}
          path: tmp/delivery-ci/*.json
