name: Monorepo dependency and release delivery
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: inventory
        options: [inventory, build, release-check]
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: bun-monorepo-delivery
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Inspect immutable source, upstreams and published artifacts
        run: |
          git remote add upstream https://github.com/oven-sh/bun.git
          bun run delivery --check-upstream --check-registry --out "$RUNNER_TEMP/delivery.json"
      - uses: actions/upload-artifact@v6
        with:
          name: monorepo-delivery-${{ github.sha }}
          path: ${{ runner.temp }}/delivery.json
  factory:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'inventory'
    runs-on: ubuntu-latest
    needs: inventory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Execute sequential owner factory and gates
        env:
          DELIVERY_OPERATION: ${{ inputs.operation }}
        run: |
          docker run --rm --cpus 6 --memory 10g \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v bun-delivery-cargo-registry:/root/.cargo/registry \
            -v bun-delivery-target:/work/target \
            ghcr.io/aphrody-labs/alpine:3.24 \
            bun run delivery --operation "$DELIVERY_OPERATION" --out /tmp/factory.json --apply
