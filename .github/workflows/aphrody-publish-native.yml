name: Aphrody native plugins publish

# Compilation and native addon smoke tests run through the existing VPS Infra
# factory. Hosted jobs only plan and consume verified owner artifacts.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      only:
        description: "n2b, oxc or n2b,oxc"
        type: string
        default: "n2b,oxc"
      dry-run:
        description: "Stage and pack verified factory assets without publishing"
        type: boolean
        default: true
      platforms:
        description: "Comma-separated existing platform keys (empty: all)"
        type: string
        default: ""
      factory-tag:
        description: "Existing owner factory draft tag (empty: plan only)"
        type: string
        default: ""
      qualification-tag:
        description: "Exact-source runtime tag carrying all eight native full receipts (required to publish)"
        type: string
        default: ""
      release-channel:
        description: "Stable publication requires complete integration qualification"
        type: choice
        options: ["candidate", "stable"]
        default: "candidate"

concurrency:
  group: aphrody-publish-native
  cancel-in-progress: false

env:
  BUN_HOST_VERSION: "aphrody-v1.4.3-aphrody.4"

jobs:
  plan:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mount Bun Video (optional submodule of aphrody-labs/bun-video)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout --recursive packages/bun-video
      - uses: ./.github/actions/setup-bun
        with:
          runtime: fork
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - env:
          ONLY: ${{ inputs.only }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          bun -e '
            const { matrix } = await import("./scripts/aphrody/publish-native.ts");
            const { default: factory } = await import("./tools/config/fusion-factory.json");
            const only = process.env.ONLY.split(",").map(x => x.trim());
            const wanted = (process.env.PLATFORMS || "").split(",").map(x => x.trim()).filter(Boolean);
            const all = matrix().include;
            if (only.some(id => !all.some(t => t.id === id)) || wanted.some(key => !all.some(t => t.key === key))) throw new Error("Unknown factory target");
            const selected = all.filter(t => only.includes(t.id) && (!wanted.length || wanted.includes(t.key)));
            if (!selected.length) throw new Error("No native factory targets selected");
            const source = factory.workspaceRoot;
            const owner = "/home/ubuntu/src/aphrody/packages/infra/workspace/src/build-factory-cleanup.ts";
            const steps = selected.map(t => {
              const output = factory.artifactRoot+"/native/"+t.id+"/"+t.key;
              return { id:t.id, key:t.key, triple:t.triple, asset:t.file, directory:source,
                command:["bun",owner,source+"/tools/config/fusion-factory.json","env","CARGO_TARGET_DIR="+output,"CARGO_BUILD_JOBS="+factory.rust.maxJobs,"bun","scripts/aphrody/build-napi.ts",t.dir,"--target",t.triple,"--jobs",String(factory.rust.maxJobs),"--out",output] };
            });
            await Bun.write("native-factory-plan.json",JSON.stringify({schema:1,revision:process.env.GITHUB_SHA,host:"vps",source,lock:factory.lockPath,cacheRoot:factory.cacheRoot,transientRoot:factory.cleanup.transientRoot,maxJobs:factory.rust.maxJobs,parallelHeavyJobs:1,reserveDiskGiB:factory.resources.reserveDiskGiB,reserveMemoryGiB:factory.resources.reserveMemoryGiB,memoryPerJobGiB:factory.resources.memoryPerJobGiB,requires:["clean source at revision","qualified target toolchain","Cargo check/test/strict Clippy","native addon smoke per platform","hashed package manifests and receipts"],steps},null,2));
          '
      - uses: actions/upload-artifact@v6
        with:
          name: native-factory-plan
          path: native-factory-plan.json
          if-no-files-found: error

  publish:
    needs: plan
    if: needs.plan.result == 'success' && inputs.factory-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
      FACTORY_TAG: ${{ inputs.factory-tag }}
      ONLY: ${{ inputs.only }}
      PLATFORMS: ${{ inputs.platforms }}
      RELEASE_CHANNEL: ${{ inputs.release-channel }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mount Bun Video (optional submodule of aphrody-labs/bun-video)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout --recursive packages/bun-video
      - uses: ./.github/actions/setup-bun
        with:
          runtime: fork
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - name: Download existing factory draft
        run: |
          gh release view "$FACTORY_TAG" -R "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > release.json
          jq -e --arg source "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $source' release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$FACTORY_TAG" > tag.json
          kind="$(jq -r .object.type tag.json)"; revision="$(jq -r .object.sha tag.json)"
          for depth in 1 2 3 4 5; do
            [ "$kind" = tag ] || break
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$revision" > tag.json
            kind="$(jq -r .object.type tag.json)"; revision="$(jq -r .object.sha tag.json)"
          done
          [ "$kind" = commit ] && [ "$revision" = "$GITHUB_SHA" ]
          gh release download "$FACTORY_TAG" -R "$GITHUB_REPOSITORY" -D dist
      - name: Verify source, manifests, checksums and native gates
        run: |
          bun -e '
            const { matrix } = await import("./scripts/aphrody/publish-native.ts");
            const { verifyFactoryArtifacts } = await import("./scripts/aphrody/release-factory.ts");
            const only=process.env.ONLY.split(",").map(x=>x.trim());
            const wanted=(process.env.PLATFORMS||"").split(",").map(x=>x.trim()).filter(Boolean);
            const selected=matrix().include.filter(t=>only.includes(t.id)&&(!wanted.length||wanted.includes(t.key)));
            if(process.env.DRY_RUN!=="true"&&process.env.RELEASE_CHANNEL!=="stable") throw new Error("npm latest requires stable qualification");
            const version=(await Bun.file("package.json").json()).version;
            const receipt=await verifyFactoryArtifacts("dist",process.env.GITHUB_SHA,version,process.env.RELEASE_CHANNEL,selected.map(t=>({triplet:t.id+"-"+t.key,assets:[t.file,t.id+".package.json"]})),["cargo-check","cargo-test","cargo-clippy","addon-smoke","source-lint","native-types"]);
            for(const id of new Set(selected.map(t=>t.id))) {
              const item=selected.find(t=>t.id===id);
              const expected=new Bun.CryptoHasher("sha256").update(await Bun.file(item.dir+"/package.json").arrayBuffer()).digest("hex");
              if(receipt.assets[id+".package.json"]!==expected) throw new Error("Factory package manifest differs from committed source: "+id);
            }
          '
      - name: Verify eight native full release receipts before publication
        if: inputs.dry-run != true
        env:
          QUALIFICATION_TAG: ${{ inputs.qualification-tag }}
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          bun scripts/aphrody/release-aggregation.ts download-verify "$QUALIFICATION_TAG" "$RUNNER_TEMP/full-qualification" "$GITHUB_SHA" "$version" "$RELEASE_CHANNEL"
      - name: Stage or publish verified native packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            bun scripts/aphrody/publish-native.ts publish --artifacts dist --only "$ONLY" --out "$RUNNER_TEMP/npm" --dry-run
          else
            bun scripts/aphrody/publish-native.ts publish --artifacts dist --only "$ONLY" --out "$RUNNER_TEMP/npm"
          fi
