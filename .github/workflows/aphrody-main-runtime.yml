name: Aphrody main runtime delivery

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: aphrody-main-runtime-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="main-runtime-${GITHUB_SHA:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: bun-linux-x64
            executable: build/release/bun
            plugin-suffix: linux-x64
          - runner: windows-2025
            asset: bun-windows-x64.exe
            executable: build/release/bun.exe
            plugin-suffix: windows-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      CARGO_BUILD_JOBS: "2"
      NINJAFLAGS: "-j2"
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mount the plugin submodules
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        # plugins/* are optional submodules (update = none) of private aphrody-labs/bun-<name> repositories.
        run: |
          gh auth setup-git
          git submodule update --init --checkout --recursive plugins
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: aphrody-v1.4.3-aphrody.2
      - name: Install nasm
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq --no-install-recommends nasm pkg-config libmnl-dev libnftnl-dev protobuf-compiler libprotobuf-dev
      - name: Install protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --no-progress -y
      - uses: ./.github/actions/setup-llvm
      - uses: ./.github/actions/setup-sccache
        with:
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Fetch pinned WinFw source archives
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun -e '
            import { join } from "node:path";
            import { winfwSourceFetchCommands } from "./scripts/build/deps/winfw.ts";
            for (const command of winfwSourceFetchCommands(process.cwd(), process.execPath, join(process.env.RUNNER_TEMP!, "source-cache"))) {
              const code = await Bun.spawn(command, { stdout: "inherit", stderr: "inherit" }).exited;
              if (code !== 0) process.exit(code);
            }
          '
      - name: Build exact main runtime
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun scripts/build.ts --profile=release --lto=off --canary=off -j2
          "${{ matrix.executable }}" --version
          revision="$("${{ matrix.executable }}" --revision)"
          expected_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [[ ! "$revision" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([a-f0-9]{7,40})$ ]] || [ "${BASH_REMATCH[1]}" != "$expected_version" ]; then
            echo "runtime version or revision format differs: $revision"; exit 1
          fi
          suffix="${BASH_REMATCH[2]}"
          case "$GITHUB_SHA" in "$suffix"*) ;; *) echo "revision differs: $revision"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/main-runtime"
          cp "${{ matrix.executable }}" "$RUNNER_TEMP/main-runtime/${{ matrix.asset }}"
          # Plugins (scripts/build/plugins.ts) are release assets of their own, fetched on first use.
          for plugin in uv vpn ssh docker just winmd; do
            exe="build/release/bun-$plugin"; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
            test -s "$exe"
            cp "$exe" "$RUNNER_TEMP/main-runtime/bun-$plugin-${{ matrix.plugin-suffix }}"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/main-runtime/*
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Verify, publish and expose checksums
        run: |
          cd dist
          chmod +x bun-linux-x64
          revision="$(./bun-linux-x64 --revision)"
          expected_version="$(./bun-linux-x64 --version)"
          if [[ ! "$revision" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([a-f0-9]{7,40})$ ]] || [ "${BASH_REMATCH[1]}" != "$expected_version" ]; then
            echo "runtime version or revision format differs: $revision"; exit 1
          fi
          suffix="${BASH_REMATCH[2]}"
          case "$GITHUB_SHA" in "$suffix"*) ;; *) echo "revision differs: $revision"; exit 1;; esac
          assets=(bun-linux-x64 bun-windows-x64.exe bun-{uv,vpn,ssh,docker,just,winmd}-linux-x64 bun-{uv,vpn,ssh,docker,just,winmd}-windows-x64.exe)
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Aphrody Bun main ${GITHUB_SHA:0:12}" \
            --notes "Automatic exact-source runtime delivery for Windows, VPS and DBFR." \
            --prerelease "${assets[@]}" SHA256SUMS.txt
