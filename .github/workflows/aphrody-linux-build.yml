name: Aphrody Linux build

# Native Linux builds of the fork, Alpine first: the build runs inside the
# distribution itself (scripts/aphrody/alpine.Dockerfile, musl, LLVM 23 from
# edge, rust nightly with a musl host) and inside Ubuntu 26.04
# (scripts/aphrody/linux.Dockerfile, glibc 2.43, as on the vps and dbfr hosts),
# for x64 and arm64. No cross-compile and no sysroot: what is tested is that
# `bun run build` works on the machine it targets. Each build is smoke-tested
# (scripts/aphrody/linux-smoke.sh) and runs a sample of the test suite with the
# debug build. The release binaries are aphrody-release.yml's.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "scripts/build/**"
      - "scripts/build.ts"
      - "scripts/aphrody/alpine.Dockerfile"
      - "scripts/aphrody/linux.Dockerfile"
      - "scripts/aphrody/linux-smoke.sh"
      - "rust-toolchain.toml"
      - "Cargo.lock"
      - ".github/workflows/aphrody-linux-build.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        type: choice
        options: ["debug", "release"]
        default: "debug"
      tests:
        description: "Test files run with the debug build (space-separated)"
        type: string
        default: "test/js/bun/util/which.test.ts test/js/bun/resolve/require.test.ts test/js/web/fetch/fetch.test.ts"

concurrency:
  group: aphrody-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'aphrody-labs/bun'
    name: ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine-3.24, ubuntu-26.04]
        arch: [x64, arm64]
    env:
      PROFILE: ${{ inputs.profile || 'debug' }}
      TESTS: ${{ inputs.tests || 'test/js/bun/util/which.test.ts test/js/bun/resolve/require.test.ts test/js/web/fetch/fetch.test.ts' }}
      IMAGE: aphrody/build-${{ matrix.distro }}
    steps:
      - name: Free disk space, add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm || true
          docker image prune -af >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h; df -h /; nproc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          case "${{ matrix.distro }}" in
            alpine-*) dockerfile=scripts/aphrody/alpine.Dockerfile ;;
            ubuntu-*) dockerfile=scripts/aphrody/linux.Dockerfile ;;
          esac
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          docker buildx build --load -t "$IMAGE" -f "$dockerfile" --build-arg "RUST_CHANNEL=$channel" \
            --cache-from "type=gha,scope=${{ matrix.distro }}-${{ matrix.arch }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.arch }}" \
            scripts/aphrody

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cache
          key: linux-build-${{ matrix.distro }}-${{ matrix.arch }}-${{ env.PROFILE }}-${{ github.sha }}
          restore-keys: linux-build-${{ matrix.distro }}-${{ matrix.arch }}-${{ env.PROFILE }}-

      - name: Build, smoke test, test sample
        run: |
          mkdir -p "$RUNNER_TEMP/cache"
          cat > "$RUNNER_TEMP/job.sh" <<'EOF'
          set -eu
          git config --global --add safe.directory '*'
          cd /src
          clang-23 --version | head -1; rustc --version; bun --version; cmake --version | head -1
          bun install --frozen-lockfile
          if [ "$PROFILE" = release ]; then
            bun scripts/build.ts --profile=release
            exe=build/release/bun
          else
            bun scripts/build.ts --profile=debug
            exe=build/debug/bun-debug
          fi
          bash scripts/aphrody/linux-smoke.sh "$exe"
          if [ "$PROFILE" = debug ]; then
            # shellcheck disable=SC2086
            BUN_DEBUG_QUIET_LOGS=1 bun scripts/build.ts --profile=debug test $TESTS
          fi
          EOF
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP:/work" \
            -e PROFILE -e TESTS -e BUN_BUILD_CACHE_DIR=/work/cache -e GITHUB_SHA \
            "$IMAGE" bash /work/job.sh
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cache
          key: linux-build-${{ matrix.distro }}-${{ matrix.arch }}-${{ env.PROFILE }}-${{ github.sha }}
