name: Aphrody release

# Native producers use the existing build, SDK and packaging owners. Missing
# capacity or SDK recipes fail before a receipt or publication is emitted.
permissions:
  contents: read

on:
  push:
    branches: ["main"]
    tags: ["bun-v*", "aphrody-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Factory draft version (empty: package.json)"
        type: string
        required: false
      targets:
        description: "Factory targets, comma separated (empty: complete matrix)"
        type: string
        default: ""
      component:
        description: "Media requires all components; runtime is a separate candidate only"
        type: choice
        options: ["media", "runtime"]
        default: "media"
      publish:
        description: "Publish an existing factory draft after verification"
        type: boolean
        default: false
      publish-npm:
        description: "Publish npm after stable factory qualification"
        type: boolean
        default: false
      release-channel:
        description: "Stable requires all integration and native platform gates"
        type: choice
        options: ["candidate", "stable"]
        default: "candidate"

concurrency:
  group: aphrody-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  # Existing qualified bootstrap, independent of the version being released.
  BUN_HOST_VERSION: "aphrody-v1.4.3-aphrody.2"

jobs:
  plan:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      native-matrix: ${{ steps.plan.outputs.native-matrix }}
      component: ${{ steps.plan.outputs.component }}
      native-targets: ${{ steps.plan.outputs.native-targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - name: Resolve committed workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test source publication guards
        run: bun test ./scripts/aphrody/release-aggregation.test.ts ./scripts/aphrody/release-workflows.test.ts ./scripts/aphrody/release-native-worker.test.ts ./scripts/aphrody/release-matrix.test.ts ./scripts/aphrody/release-factory.test.ts ./scripts/aphrody/release-r2.test.ts
      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_COMPONENT: ${{ github.event_name == 'push' && 'runtime' || inputs.component || 'media' }}
          INPUT_CHANNEL: ${{ inputs.release-channel || 'candidate' }}
          INPUT_PUBLISH_NPM: ${{ inputs.publish-npm }}
        run: |
          bun -e '
            const runtime = await import("./scripts/aphrody/publish-runtime.ts");
            const factory = await import("./scripts/aphrody/release-matrix.ts");
            const version = process.env.INPUT_VERSION ? runtime.versionFromTag(process.env.INPUT_VERSION) : runtime.readBaseVersion();
            if (version !== runtime.readBaseVersion()) throw new Error("Factory version must match committed package.json");
            const targets = (process.env.INPUT_TARGETS || "").split(",").map(s => s.trim()).filter(Boolean);
            const component = process.env.INPUT_COMPONENT;
            if (!["media", "runtime"].includes(component)) throw new Error("Unknown release component");
            if (component === "runtime" && (process.env.INPUT_CHANNEL !== "candidate" || process.env.INPUT_PUBLISH_NPM === "true")) throw new Error("Runtime component supports candidate artifacts only, without npm publication");
            const plan = factory.vpsRuntimeReleasePlan(process.env.GITHUB_SHA, targets);
            await Bun.write("factory-plan.json", JSON.stringify(plan, null, 2) + "\n");
            const native = factory.nativeFullReleasePlan(process.env.GITHUB_SHA);
            if (component === "runtime" && targets.length) {
              if (new Set(targets).size !== targets.length || targets.some(t => !native.targets.some(n => n.target === t))) throw new Error("Unknown or duplicate native target");
              native.targets = native.targets.filter(t => targets.includes(t.target));
            }
            await Bun.write("native-full-plan.json", JSON.stringify(native, null, 2) + "\n");
            const tag = process.env.GITHUB_REF_TYPE === "tag" ? process.env.GITHUB_REF_NAME : runtime.releaseTag(version);
            if (runtime.versionFromTag(tag) !== version) throw new Error("Release tag version differs from source");
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\ncomponent=${component}\nnative-targets=${native.targets.map(t => t.target).join(" ")}\nnative-matrix=${JSON.stringify({include:native.targets})}\n`);
          '
      - uses: actions/upload-artifact@v6
        with:
          name: factory-plan
          path: |
            factory-plan.json
            native-full-plan.json
          if-no-files-found: error

  native-full:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.native-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      NINJAFLAGS: "-j2"
      GIT_SHA: ${{ github.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      # A target without a published media SDK builds its own from this pinned source archive, on its native runner.
      BUN_MEDIA_SOURCE_ARCHIVE_URL: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_URL }}
      BUN_MEDIA_SOURCE_ARCHIVE_SHA256: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_SHA256 }}
      BUN_MEDIA_SOURCE_ARCHIVE_BYTES: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_BYTES }}
      # The worker strips it from every native command except setup's GitHub API reads.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ matrix.controlBootstrap.tag }}
          expected-sha256: ${{ matrix.controlBootstrap.sha256 }}
          expected-bytes: ${{ matrix.controlBootstrap.bytes }}
          expected-source: ${{ matrix.controlBootstrap.source }}
      - uses: ./.github/actions/setup-sccache
        with:
          endpoint: ${{ secrets.R2_ENDPOINT }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Resolve committed workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Provision the pinned Linux sysroots
        if: runner.os == 'Linux'
        run: |
          key="linux-$([ "$(uname -m)" = aarch64 ] && echo aarch64 || echo x64)-ubuntu"
          case "$TARGET" in *-musl) tools=llvm,musl-sysroot ;; *) tools=glibc-sysroot ;; esac
          bake="$RUNNER_TEMP/sysroot-bake"
          mkdir -p "$bake"
          bun scripts/build/ci-images/spec.ts --only "$tools" "$key" > "$bake/bootstrap.sh"
          sudo apt-get update -qq
          sudo sh "$bake/bootstrap.sh" "$GITHUB_SHA" "$key"
      - name: Build the exact Windows core before SDK packaging
        if: startsWith(matrix.target, 'windows-')
        env:
          BUN_NATIVE_SDK_MODE: source
          BUN_MEDIA_SOURCE_ARCHIVE_URL: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_URL }}
          BUN_MEDIA_SOURCE_ARCHIVE_SHA256: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_SHA256 }}
          BUN_MEDIA_SOURCE_ARCHIVE_BYTES: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_BYTES }}
        run: |
          bun --no-env-file -e 'const {nativeMediaSourceArchivePin}=await import("./scripts/aphrody/release-native-worker.ts");nativeMediaSourceArchivePin(process.env);'
          bun scripts/aphrody/release-native-worker.ts prepare-core "$TARGET" "$GITHUB_SHA" "$VERSION" "$RUNNER_TEMP/native-full"
      - name: Qualify candidate ZIP and FFI, then bootstrap native Windows SDKs
        if: startsWith(matrix.target, 'windows-')
        env:
          BUN_NATIVE_SDK_MODE: source
          BUN_MEDIA_SOURCE_ARCHIVE_URL: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_URL }}
          BUN_MEDIA_SOURCE_ARCHIVE_SHA256: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_SHA256 }}
          BUN_MEDIA_SOURCE_ARCHIVE_BYTES: ${{ vars.BUN_MEDIA_SOURCE_ARCHIVE_BYTES }}
        run: |
          bun --no-env-file -e '
            const {join}=await import("node:path");
            const output=join(process.env.RUNNER_TEMP,"native-full");
            const core=await Bun.file(join(output,"diagnostics/core-preparation.json")).json();
            const child=Bun.spawn([core.runtime,"--no-env-file","scripts/aphrody/release-native-worker.ts","bootstrap-media",process.env.TARGET,process.env.GITHUB_SHA,process.env.VERSION,output],{stdin:"ignore",stdout:"inherit",stderr:"inherit"});
            const status=await child.exited;if(status!==0)process.exit(status);
            const receipt=await Bun.file(join(output,"diagnostics/media-bootstrap.json")).json();
            const values={BUN_NATIVE_RUNTIME_CANDIDATE:core.runtime,BUN_MEDIA_SDK_INPUTS:receipt.inputPath,BUN_MEDIA_SDK_INPUTS_SHA256:receipt.inputSHA256,BUN_MEDIA_VULKAN_HEADERS:receipt.vulkanHeaders,BUN_MEDIA_VULKAN_LICENSE:receipt.vulkanLicense};
            for(const value of Object.values(values))if(typeof value!=="string"||/[\r\n\0]/.test(value))throw Error("Unsafe SDK environment receipt");
            const file=Bun.file(process.env.GITHUB_ENV);
            await Bun.write(file,await file.text()+Object.entries(values).map(([key,value])=>`${key}=${value}\n`).join(""));
          '
      - name: Native capacity, source and owner prerequisites
        if: needs.plan.outputs.component == 'media'
        run: >-
          "${BUN_NATIVE_RUNTIME_CANDIDATE:-bun}" scripts/aphrody/release-native-worker.ts preflight "$TARGET" "$GITHUB_SHA" "$VERSION" "$RUNNER_TEMP/native-full"
      - name: Build SDK, runtime and sidecars, then execute exact native gates
        if: needs.plan.outputs.component == 'media'
        run: >-
          "${BUN_NATIVE_RUNTIME_CANDIDATE:-bun}" scripts/aphrody/release-native-worker.ts produce "$TARGET" "$GITHUB_SHA" "$VERSION" "$RUNNER_TEMP/native-full"
      - name: Native runtime component prerequisites
        if: needs.plan.outputs.component == 'runtime'
        run: >-
          "${BUN_NATIVE_RUNTIME_CANDIDATE:-bun}" scripts/aphrody/release-native-worker.ts preflight-runtime "$TARGET" "$GITHUB_SHA" "$VERSION" "$RUNNER_TEMP/native-full"
      - name: Produce the separately qualified native runtime candidate
        if: needs.plan.outputs.component == 'runtime'
        run: >-
          "${BUN_NATIVE_RUNTIME_CANDIDATE:-bun}" scripts/aphrody/release-native-worker.ts produce-runtime "$TARGET" "$GITHUB_SHA" "$VERSION" "$RUNNER_TEMP/native-full"
      - uses: actions/upload-artifact@v6
        with:
          name: native-full-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-full/products/*.zip
            ${{ runner.temp }}/native-full/products/*-full.qualification.json
            ${{ runner.temp }}/native-full/products/*.platform-gates.json
            ${{ runner.temp }}/native-full/products/*.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: plugins-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-full/plugins/*
          compression-level: 0
          if-no-files-found: error
      - name: Preserve failed capacity or owner diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-full-failure-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-full/diagnostics/*
            ${{ runner.temp }}/native-full/products/*.log
          if-no-files-found: error

  aggregate:
    needs: [plan, native-full]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_CHANNEL: ${{ inputs.release-channel || 'candidate' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - name: Resolve committed workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v6
        with:
          pattern: native-full-*-${{ github.sha }}
          path: ${{ runner.temp }}/full-qualification
          merge-multiple: true
      - name: Verify all eight exact-source native full products
        if: needs.plan.outputs.component == 'media'
        run: bun scripts/aphrody/release-aggregation.ts aggregate "$RUNNER_TEMP/full-qualification" "$GITHUB_SHA" "$VERSION" "$RELEASE_CHANNEL"
      - name: Verify selected exact-source runtime candidates
        if: needs.plan.outputs.component == 'runtime'
        env:
          NATIVE_TARGETS: ${{ needs.plan.outputs.native-targets }}
        run: |
          read -r -a targets <<< "$NATIVE_TARGETS"
          bun scripts/aphrody/release-aggregation.ts aggregate-runtime "$RUNNER_TEMP/full-qualification" "$GITHUB_SHA" "$VERSION" candidate "${targets[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.plan.outputs.component }}-full-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/full-qualification/*
          if-no-files-found: error

  publish:
    needs: [plan, aggregate]
    if: inputs.publish && needs.aggregate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.release-channel }}
      INPUT_TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - name: Resolve committed workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download existing owner factory draft
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > release.json
          jq -e --arg source "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $source' release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json
          kind="$(jq -r .object.type tag.json)"; revision="$(jq -r .object.sha tag.json)"
          for depth in 1 2 3 4 5; do
            [ "$kind" = tag ] || break
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$revision" > tag.json
            kind="$(jq -r .object.type tag.json)"; revision="$(jq -r .object.sha tag.json)"
          done
          [ "$kind" = commit ] && [ "$revision" = "$GITHUB_SHA" ]
          if [ "${{ needs.plan.outputs.component }}" = media ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          fi
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.plan.outputs.component }}-full-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/full-aggregate
      - name: Verify exact source, checksums, gates and native platform receipts
        if: needs.plan.outputs.component == 'media'
        run: |
          bun scripts/aphrody/release-aggregation.ts verify "$GITHUB_WORKSPACE/dist" "$GITHUB_SHA" "$VERSION" "$RELEASE_CHANNEL" "$RUNNER_TEMP/full-aggregate/media-full-qualification.json"
          bun -e '
            const { verifyFactoryRelease } = await import("./scripts/aphrody/release-factory.ts");
            const targets = (process.env.INPUT_TARGETS || "").split(",").map(s => s.trim()).filter(Boolean);
            await verifyFactoryRelease("dist", process.env.GITHUB_SHA, process.env.VERSION, process.env.RELEASE_CHANNEL, targets);
          '
      - name: Verify and upload immutable runtime candidate assets
        if: needs.plan.outputs.component == 'runtime'
        env:
          NATIVE_TARGETS: ${{ needs.plan.outputs.native-targets }}
        run: |
          test "$RELEASE_CHANNEL" = candidate
          read -r -a targets <<< "$NATIVE_TARGETS"
          bun scripts/aphrody/release-aggregation.ts verify-runtime "$RUNNER_TEMP/full-aggregate" "$GITHUB_SHA" "$VERSION" candidate "${targets[@]}"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets > existing-assets.json
          bun -e '
            const root = process.env.RUNNER_TEMP + "/full-aggregate";
            const receipt = await Bun.file(root + "/runtime-full-qualification.json").json();
            const names = ["runtime-full-qualification.json", ...Object.keys(receipt.assets)];
            const existing = new Set((await Bun.file("existing-assets.json").json()).assets.map(a => a.name));
            if (names.some(n => existing.has(n))) throw new Error("Immutable runtime asset already exists");
            await Bun.write("runtime-upload.json", JSON.stringify(names));
          '
          bun -e '
            const names = await Bun.file("runtime-upload.json").json();
            const paths = names.map(n => process.env.RUNNER_TEMP + "/full-aggregate/" + n);
            const child = Bun.spawn(["gh", "release", "upload", process.env.TAG, "-R", process.env.GITHUB_REPOSITORY, ...paths], {stdout:"inherit",stderr:"inherit"});
            if (await child.exited !== 0) throw new Error("Runtime candidate upload failed; inspect existing assets before retry");
          '
      - uses: actions/download-artifact@v6
        with:
          pattern: plugins-*-${{ github.sha }}
          path: ${{ runner.temp }}/plugins
          merge-multiple: true
      - name: Checksum and upload every plugin of every shipped target
        env:
          NATIVE_TARGETS: ${{ needs.plan.outputs.native-targets }}
        run: |
          cd "$RUNNER_TEMP/plugins"
          read -r -a targets <<< "$NATIVE_TARGETS"
          mapfile -t assets < <(cd "$GITHUB_WORKSPACE" && bun -e '
            const { nativePluginAssets } = await import("./scripts/aphrody/release-native-worker.ts");
            for (const target of process.argv.slice(1)) for (const { asset } of nativePluginAssets(target)) console.log(asset);
          ' "${targets[@]}")
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do test -s "$asset"; done
          if gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O SHA256SUMS.existing 2>/dev/null; then
            grep -v -E '  bun-[a-z0-9]+-(linux|darwin|windows)-' SHA256SUMS.existing > SHA256SUMS.txt || true
          else
            : > SHA256SUMS.txt
          fi
          sha256sum "${assets[@]}" >> SHA256SUMS.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${assets[@]}" SHA256SUMS.txt
      - name: Publish qualified draft
        run: |
          if [ "$RELEASE_CHANNEL" = candidate ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=true --latest=false
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
          fi
      - name: Publish npm from verified factory assets
        if: needs.plan.outputs.component == 'media' && inputs.publish-npm && inputs.release-channel == 'stable'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/aphrody/publish-runtime.ts publish --version "$VERSION" --assets dist --out "$RUNNER_TEMP/npm"
      - name: Mirror the published release to R2 (dist.aphrody.app)
        if: needs.plan.outputs.component == 'media'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          bun scripts/aphrody/release-aggregation.ts verify "$GITHUB_WORKSPACE/dist" "$GITHUB_SHA" "$VERSION" "$RELEASE_CHANNEL" "$RUNNER_TEMP/full-aggregate/media-full-qualification.json"
          if [ "$RELEASE_CHANNEL" = stable ]; then
            bun scripts/aphrody/release-r2.ts
          else
            bun scripts/aphrody/release-r2.ts "$TAG"
          fi
