name: Aphrody release

# Builds the fork's runtime like upstream does (.buildkite/ci.ts): every target
# is compiled on one Linux arm64 host, a Debian 13 container set up by the
# steps of CI's build image (scripts/aphrody/build-host.ts reuses
# scripts/build/ci-images/spec.ts), with `scripts/build.ts --profile=release
# --os --arch [--abi]` (ThinLTO on): linux-gnu links against the glibc 2.31
# sysroot, musl against Alpine's, Windows against the xwin MSVC/SDK splat and
# macOS against Apple's SDK. Each binary is then run on a machine of its own
# platform (linux-gnu in debian:bullseye, glibc 2.31; musl in Alpine).
# Assets use upstream's names: bun-<os>-<arch>[-musl].zip, x64 also re-zipped
# as -baseline (upload-release.sh), + SHA256SUMS.txt on the GitHub Release
# aphrody-v<version>; then @aphrody/bun-runtime and its platform packages go
# to npm (scripts/aphrody/publish-runtime.ts).
# Version: <package.json version>-aphrody.<n>, which `bun --version` prints.

permissions:
  contents: read

on:
  push:
    tags:
      - "aphrody-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "<X.Y.Z>-aphrody.<n> (empty: package.json version + -aphrody.1)"
        type: string
        required: false
      targets:
        description: "Comma-separated targets of scripts/aphrody/build-host.ts (empty: all)"
        type: string
        default: ""
      lto:
        description: "ThinLTO across bun, JSC and Rust, as upstream ships"
        type: choice
        options: ["on", "off"]
        default: "on"
      publish-npm:
        description: "Publish @aphrody/bun-runtime to npm after the release"
        type: boolean
        default: true
      publish-only:
        description: "Skip the builds: publish npm from the zips already on the release"
        type: boolean
        default: false

concurrency:
  group: aphrody-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  BUN_HOST_VERSION: "1.4.2"

jobs:
  prepare:
    if: github.repository == 'aphrody-labs/bun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      version-tag: ${{ steps.plan.outputs.version-tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      build: ${{ steps.plan.outputs.build }}
      exists: ${{ steps.plan.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGETS: ${{ inputs.targets }}
          PUBLISH_ONLY: ${{ inputs.publish-only && 'true' || 'false' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun -e '
            const m = await import("./scripts/aphrody/publish-runtime.ts");
            const host = await import("./scripts/aphrody/build-host.ts");
            const env = process.env;
            const version = env.REF_TYPE === "tag" ? m.versionFromTag(env.REF_NAME)
              : env.INPUT_VERSION ? m.versionFromTag(env.INPUT_VERSION)
              : m.computeRuntimeVersion(m.readBaseVersion(), 1);
            const { base, n } = m.parseRuntimeVersion(version);
            if (base !== m.readBaseVersion())
              console.log(`::warning::${version} is not based on package.json ${m.readBaseVersion()}`);
            const wanted = (env.INPUT_TARGETS ?? "").split(",").map(s => s.trim()).filter(Boolean);
            const targets = wanted.length ? wanted.map(host.findTarget) : host.releaseTargets;
            // A dispatched release pushes its own tag with a token that triggers this workflow again;
            // that push must not rebuild and clobber assets already published to npm.
            const exists = env.REF_TYPE === "tag" && (await fetch(
              `https://api.github.com/repos/${env.GITHUB_REPOSITORY}/releases/tags/${m.releaseTag(version)}`,
              { headers: { authorization: `Bearer ${env.GITHUB_TOKEN}` } })).ok;
            const include = env.PUBLISH_ONLY === "true" || exists ? [] : targets;
            const out = [
              `version=${version}`,
              `tag=${m.releaseTag(version)}`,
              `version-tag=aphrody.${n}`,
              `matrix=${JSON.stringify({ include })}`,
              `build=${include.length > 0}`,
              `exists=${exists}`,
            ];
            require("fs").appendFileSync(env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: build ${{ matrix.target }}
    # Upstream's build host is linux arm64 too; every target is cross-compiled from it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      LTO: ${{ inputs.lto || 'on' }}
      TARGET: ${{ matrix.target }}
      TRIPLET: ${{ matrix.triplet }}
      VERSION_TAG: ${{ needs.prepare.outputs.version-tag }}
    steps:
      - name: Free disk space, add swap
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm || true
          docker image prune -af >/dev/null 2>&1 || true
          # A ThinLTO link of bun + JSC + Rust peaks above the runner's 16 GB.
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h
          df -h /
          nproc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_HOST_VERSION }}

      - name: Plan
        run: |
          bun scripts/aphrody/build-host.ts provision --target "$TARGET" --out "$RUNNER_TEMP/provision.sh"
          args="$(bun scripts/aphrody/build-host.ts args --target "$TARGET" --lto "$LTO" --version-tag "$VERSION_TAG")"
          echo "BUILD_ARGS=$args --build-dir=build/out" >> "$GITHUB_ENV"
          echo "$args"
          mkdir -p "$RUNNER_TEMP/cache" "$RUNNER_TEMP/dist"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cache/ccache
          key: ccache-${{ matrix.target }}-lto-${{ inputs.lto || 'on' }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-lto-${{ inputs.lto || 'on' }}-

      # Upstream's builds inherit the order file a trace-order step of an earlier
      # build published (scripts/build/ci.ts inheritOrderFile); without it the fork
      # linked unordered: `bun -e 0` took 8.0 ms CPU vs 6.0 ms for upstream 1.4.2,
      # with 290 vs 57 page faults in .text. Here the smoke job traces each release
      # and publishes <triplet>.order; configure keeps a linker.order already there.
      # musl is not traced: it links with the gnu trace of its arch (same code).
      - name: Inherit the symbol order file
        if: matrix.abi == 'gnu' || matrix.abi == 'musl' || matrix.target == 'darwin-aarch64'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/out
          order="${TRIPLET%-musl}.order"
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 10 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$order" -O build/out/linker.order --clobber 2>/dev/null || continue
            n="$(grep -cv '^#' build/out/linker.order || true)"
            if [ "${n:-0}" -gt 0 ]; then echo "symbol order: $order from $tag, $n functions"; exit 0; fi
          done
          rm -f build/out/linker.order
          echo "::warning::no recent release has $order; $TRIPLET links unordered"

      - name: Build in debian:13
        run: |
          cat > "$RUNNER_TEMP/build.sh" <<'EOF'
          set -eu
          sh /work/provision.sh > /work/provision.log 2>&1 || { tail -80 /work/provision.log; exit 1; }
          . /etc/profile.d/bun-ci.sh
          git config --global --add safe.directory '*'
          cd /src
          clang --version | head -1; rustc --version; bun --version; node --version
          # shellcheck disable=SC2086
          bun scripts/build.ts $BUILD_ARGS
          EOF
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP:/work" \
            -e BUILD_ARGS -e BUN_BUILD_CACHE_DIR=/work/cache -e BUN_DEBUG_QUIET_LOGS=1 -e CI=true \
            debian:13 sh /work/build.sh
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cache/ccache
          key: ccache-${{ matrix.target }}-lto-${{ inputs.lto || 'on' }}-${{ github.sha }}

      - name: Package
        run: |
          ext=""; [ "${TARGET%%-*}" = windows ] && ext=".exe"
          out="$RUNNER_TEMP/dist"; b=build/out
          mkdir -p "$out/$TRIPLET" "$out/$TRIPLET-profile"
          cp "$b/bun$ext" "$out/$TRIPLET/"
          cp "$b/bun-profile$ext" "$out/$TRIPLET-profile/"
          for f in bun-profile.pdb features.json; do [ -f "$b/$f" ] && cp "$b/$f" "$out/$TRIPLET-profile/"; done
          [ -d "$b/bun-profile.dSYM" ] && cp -R "$b/bun-profile.dSYM" "$out/$TRIPLET-profile/"
          file "$out/$TRIPLET/bun$ext"
          if [ "${TARGET%%-*}" = linux ] && [ "${TARGET#*-*-}" != musl ]; then
            echo "glibc symbol versions required:"
            { objdump -T "$out/$TRIPLET/bun" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3; } || true
          fi
          cd "$out"
          cmake -E tar cf "$TRIPLET.zip" --format=zip "$TRIPLET"
          cmake -E tar cf "$TRIPLET-profile.zip" --format=zip "$TRIPLET-profile"
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triplet }}
          path: |
            ${{ runner.temp }}/dist/${{ matrix.triplet }}.zip
            ${{ runner.temp }}/dist/${{ matrix.triplet }}-profile.zip
          compression-level: 0
          retention-days: 14

  smoke:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.build == 'true' }}
    name: smoke ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TRIPLET: ${{ matrix.triplet }}
      CONTAINER: ${{ matrix.container }}
      ABI: ${{ matrix.abi }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      # Before the download: checkout cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.abi == 'gnu' || matrix.target == 'darwin-aarch64'
        with:
          persist-credentials: false
          sparse-checkout: scripts/orderfile
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.triplet }}
          path: dist
      - name: Run the binary
        shell: bash
        run: |
          cd dist
          unzip -q -o "$TRIPLET.zip"
          cat > smoke.sh <<'EOF'
          set -eu
          # Like upstream's musl build, the binary links libstdc++ and libgcc dynamically.
          if command -v apk >/dev/null; then apk add --no-cache -q libstdc++ libgcc; fi
          bin="$1"
          v="$("$bin" --version)"; echo "--version: $v"
          [ "$v" = "$VERSION" ] || { echo "expected $VERSION"; exit 1; }
          "$bin" --revision
          "$bin" -e 'console.log(Bun.version, process.platform, process.arch, Bun.version_with_sha)'
          "$bin" -e 'const r = await fetch("data:text/plain,ok"); console.log(await r.text(), Bun.hash("x"))'
          # The .1 Windows binary (MSVC 14.51 toolset, ABI break with WebKit) crashed on these.
          "$bin" -e 'await import("node:fs"); console.log(2)'
          printf 'import { test, expect } from "bun:test";\ntest("smoke", async () => { await import("node:fs"); expect(1 + 1).toBe(2); });\n' > smoke.test.ts
          "$bin" test ./smoke.test.ts
          "$bin" -e 'const path = await import("node:path"); const { execFileSync } = require("node:child_process"); const out = execFileSync(process.execPath, ["-e", "console.log(6 * 7)"]).toString().trim(); if (out !== "42") throw new Error(out); console.log(path.join("a", "b"), out)'
          EOF
          if [ -n "$CONTAINER" ]; then
            docker run --rm -e VERSION -v "$PWD:/d" -w /d "$CONTAINER" sh smoke.sh "/d/$TRIPLET/bun"
            # The oldest glibc above, the newest here (Aphrody's hosts and build image run Ubuntu 26.04).
            if [ "$ABI" = gnu ]; then
              docker run --rm -e VERSION -v "$PWD:/d" -w /d ubuntu:26.04 sh smoke.sh "/d/$TRIPLET/bun"
            fi
          elif [ "$RUNNER_OS" = Windows ]; then
            bash smoke.sh "./$TRIPLET/bun.exe"
          else
            chmod +x "$TRIPLET/bun"
            bash smoke.sh "./$TRIPLET/bun"
          fi
          touch "$RUNNER_TEMP/smoked"
      # The release job ships only the targets that have this marker.
      - uses: actions/upload-artifact@v4
        with:
          name: smoked-${{ matrix.triplet }}
          path: ${{ runner.temp }}/smoked
          retention-days: 1
      # Like upstream's trace-order step (.buildkite/ci.ts getTraceOrderStep): the
      # traced bun-profile is its own interpreter; the next release links with it.
      - name: Trace the symbol order file
        if: matrix.abi == 'gnu' || matrix.target == 'darwin-aarch64'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          unzip -q -o "dist/$TRIPLET-profile.zip" -d dist
          chmod +x "dist/$TRIPLET-profile/bun-profile"
          "./dist/$TRIPLET-profile/bun-profile" scripts/orderfile/generate.ts \
            --build-dir="dist/$TRIPLET-profile" --out="dist/$TRIPLET.order"
          echo "$(grep -cv '^#' "dist/$TRIPLET.order") functions in $TRIPLET.order"
      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'gnu' || matrix.target == 'darwin-aarch64'
        continue-on-error: true
        with:
          name: order-${{ matrix.triplet }}
          path: dist/${{ matrix.triplet }}.order
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [prepare, build, smoke]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # github.token was refused (403) creating the aphrody-v1.4.3-aphrody.2 release.
      GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      MATRIX: ${{ needs.prepare.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bun-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: smoked
          pattern: smoked-*
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          pattern: order-*
          merge-multiple: true
      - name: Drop targets whose smoke test failed
        run: |
          cd dist
          for zip in *.zip; do
            triplet="${zip%.zip}"; triplet="${triplet%-profile}"
            if [ ! -d "../smoked/smoked-$triplet" ]; then
              echo "::warning::$triplet did not pass its smoke test; not released"
              rm -f "$zip"
            fi
          done
      - name: Baseline aliases
        run: |
          cd dist
          # x64 ships one binary under the plain name; upstream re-zips it as -baseline for older `bun upgrade`.
          for pair in $(echo "$MATRIX" | jq -r '.include[] | select(.baselineAlias) | "\(.triplet)=\(.baselineAlias)"'); do
            src="${pair%%=*}"; dst="${pair#*=}"
            for kind in "" "-profile"; do
              [ -f "$src$kind.zip" ] || continue
              work="$(mktemp -d)"
              unzip -q "$src$kind.zip" -d "$work"
              mv "$work/$src$kind" "$work/$dst$kind"
              (cd "$work" && zip -qr "$OLDPWD/$dst$kind.zip" "$dst$kind")
              rm -rf "$work"
            done
          done
          ls -la
      - name: Create or update the release
        run: |
          cd dist
          ls *.zip >/dev/null 2>&1 || { echo "::error::no target built"; exit 1; }
          # The musl builds are the fork's primary Linux assets (Alpine first): never release without one that was asked for.
          for t in $(echo "$MATRIX" | jq -r '.include[] | select(.abi == "musl") | .triplet'); do
            [ -f "$t.zip" ] || { echo "::error::$t.zip, a primary Linux asset, failed to build or run"; exit 1; }
          done
          notes="Aphrody fork of Bun, built from ${GITHUB_SHA} like upstream: cross-compiled on linux arm64 against pinned sysroots (musl: Alpine, the primary Linux assets; linux-gnu: glibc 2.31), release profile, LTO ${{ inputs.lto || 'on' }}.
          \`bun --version\` prints ${VERSION}; \`Bun.version\` stays the base version for semver checks.
          npm: \`bunx @aphrody/bun-runtime@${VERSION} --version\`."
          # <triplet>.order: the symbol order file the next release's build links with.
          assets="$(ls *.zip *.order 2>/dev/null)"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber $assets
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Aphrody Bun $VERSION" --notes "$notes" $assets
          fi
          mkdir -p ../all
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.zip' -D ../all --clobber
          (cd ../all && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt && gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber SHA256SUMS.txt)
          if [ "${{ needs.build.result }}" != success ] || [ "${{ needs.smoke.result }}" != success ]; then
            echo "::warning::some targets failed to build or run; the release has only the ones that passed"
          fi

  npm:
    needs: [prepare, build, smoke, release]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.exists != 'true' && (needs.release.result == 'success' || needs.prepare.outputs.build != 'true') && (inputs.publish-npm || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'bun-*.zip' -D "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/assets" && sha256sum *.zip)
          bun scripts/aphrody/publish-runtime.ts publish --version "$VERSION" --assets "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/npm"
