name: native

# Release build of this fork (ThinLTO across Rust, C++ and the -lto WebKit prebuilt; every
# feature of the release profile), cross-compiled from one debian-13 aarch64 host like
# upstream's Buildkite lanes, then measured against upstream stable and canary.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "JSON list of targets"
        default: '["linux-x64-musl","linux-x64-gnu"]'
      artifacts_run:
        description: "Bench only: reuse the build artifacts of this run id"
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    if: inputs.artifacts_run == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets || '["linux-x64-musl","linux-x64-gnu"]') }}
    steps:
      - name: Free disk, add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune -af > /dev/null || true
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile > /dev/null && sudo swapon /swapfile
          nproc; free -g; df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Generate the host script
        run: |
          curl -fsSL -o bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip
          unzip -q bun.zip && ./bun-linux-aarch64/bun scripts/build/ci-images/spec.ts linux-aarch64-debian
          rm -rf bun.zip bun-linux-aarch64
      - name: Build
        run: |
          t=${{ matrix.target }}
          case $t in
            linux-x64-musl) args="--os=linux --arch=x64 --abi=musl" ;;
            linux-x64-gnu)  args="--os=linux --arch=x64 --abi=gnu" ;;
            windows-x64)    args="--os=windows --arch=x64" ;;
          esac
          docker run --rm -v "$PWD:/src" -w /src debian:13 sh -c "
            set -e
            sh .github/native/host.sh > /tmp/host.log 2>&1 || { tail -80 /tmp/host.log; exit 1; }
            . /etc/profile.d/bun-ci.sh
            git config --global --add safe.directory /src
            nice -n 19 node scripts/build.ts --profile=release $args --build-dir=build/$t -j4
            chown -R $(id -u):$(id -g) build
          "
      - name: Collect
        run: |
          t=${{ matrix.target }}
          mkdir -p out
          for f in bun bun.exe bun-profile bun-profile.exe; do
            [ -f build/$t/$f ] && cp build/$t/$f out/
          done
          ls -l out
          file out/* || true
      - uses: actions/upload-artifact@v7
        with:
          name: bun-native-${{ matrix.target }}
          path: out/
          retention-days: 30

  bench:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: bun-native-linux-*
          run-id: ${{ inputs.artifacts_run || github.run_id }}
          github-token: ${{ github.token }}
          path: art
      - name: Tools and reference binaries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq hyperfine jq > /dev/null
          curl -fsSL -o oha https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64 && chmod +x oha && sudo mv oha /usr/local/bin/
          mkdir -p ref
          get() { curl -fsSL -o ref/$1.zip https://github.com/oven-sh/bun/releases/download/$2/$3.zip && unzip -q -o ref/$1.zip -d ref/$1 && mv ref/$1/$3/bun ref/$1/bun; }
          get stable bun-v1.4.4 bun-linux-x64
          get canary canary bun-linux-x64
          get canary-musl canary bun-linux-x64-musl
          chmod +x ref/*/bun art/*/bun* || true
          ls -l ref/*/bun art/*/*
          (cd test && ./../ref/canary/bun install > /dev/null 2>&1 || true)
      - name: Bench glibc (host)
        run: |
          bins=(stable=$PWD/ref/stable/bun canary=$PWD/ref/canary/bun)
          [ -x art/bun-native-linux-x64-gnu/bun ] && bins+=(fork-gnu=$PWD/art/bun-native-linux-x64-gnu/bun)
          echo "# native bench $(git rev-parse --short HEAD), glibc" > bench-gnu.md
          OHA=/usr/local/bin/oha TESTS_DIR=$PWD bash .github/native/bench.sh $PWD/bench-gnu.md "${bins[@]}"
          cat bench-gnu.md >> $GITHUB_STEP_SUMMARY
      - name: Bench musl (alpine:3.23)
        run: |
          bins="canary-musl=/w/ref/canary-musl/bun"
          [ -x art/bun-native-linux-x64-musl/bun ] && bins="$bins fork-musl=/w/art/bun-native-linux-x64-musl/bun"
          echo "# native bench $(git rev-parse --short HEAD), musl" > bench-musl.md
          docker run --rm --network host -v "$PWD:/w" -v /usr/local/bin/oha:/usr/local/bin/oha:ro -w /w alpine:3.23 sh -c "
            apk add -q bash hyperfine jq curl file coreutils procps libstdc++ libgcc gcompat > /dev/null
            # what the binary needs beyond musl itself
            for b in $bins; do echo \"\$b\"; ldd \${b#*=} | sed 's/^/  /'; done > /w/musl-ldd.txt 2>&1
            OHA=/usr/local/bin/oha TESTS_DIR=/w bash .github/native/bench.sh /w/bench-musl.md $bins
          "
          { echo; echo '### musl runtime dependencies (ldd)'; echo; echo '```'; cat musl-ldd.txt; echo '```'; } >> bench-musl.md
          cat bench-musl.md >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: |
            bench-*.md
            musl-ldd.txt
            t-*.log

  release:
    needs: build
    if: always() && inputs.artifacts_run == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bun-native-*
          path: art
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls art 2>/dev/null | grep -q . || { echo "no artifact"; exit 0; }
          tag=native-$(date -u +%Y%m%d)-${GITHUB_SHA::10}
          cd art && for d in */; do (cd "$d" && zip -q -r "../${d%/}.zip" .); done; ls -l *.zip; sha256sum *.zip > SHA256SUMS
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$tag" --notes "Release build (ThinLTO) of $GITHUB_SHA, cross-compiled on ubuntu-24.04-arm (debian:13)." *.zip SHA256SUMS
