name: Aphrody web-inspector-bun publish

# Builds packages/bun-inspector-frontend from oven-sh/WebKit at WEBKIT_VERSION
# and publishes it as @aphrody/web-inspector-bun
# (scripts/aphrody/publish-web-inspector.ts).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "<X.Y.Z>-aphrody.<n> (empty: Bun version, next n on npm)"
        type: string
        required: false
      dry-run:
        description: "Build and pack without publishing"
        type: boolean
        default: false
      qualification-tag:
        description: "Exact-source runtime tag carrying all eight native full receipts (required to publish)"
        type: string
        default: ""

concurrency:
  group: aphrody-publish-web-inspector
  cancel-in-progress: false

env:
  BUN_HOST_VERSION: "aphrody-v1.4.3-aphrody.4"

jobs:
  publish:
    if: github.repository == 'aphrody-labs/bun' || github.repository == 'aphrody-labs/bun-os'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mount Bun Video (optional submodule of aphrody-labs/bun-video)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git submodule update --init --checkout --recursive packages/bun-video
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_HOST_VERSION }}
      - name: Verify eight native full release receipts before publication
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.APHRODY_SYNC_TOKEN || github.token }}
          QUALIFICATION_TAG: ${{ inputs.qualification-tag }}
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          channel=candidate; case "$QUALIFICATION_TAG" in bun-v*) channel=stable;; esac
          bun scripts/aphrody/release-aggregation.ts download-verify "$QUALIFICATION_TAG" "$RUNNER_TEMP/full-qualification" "$GITHUB_SHA" "$version" "$channel"
      - name: Build and publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          bun scripts/aphrody/publish-web-inspector.ts publish ${VERSION:+--version "$VERSION"} $DRY_RUN
