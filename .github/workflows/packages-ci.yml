name: Packages CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - .github/actions/setup-bun/**
      - .github/workflows/packages-ci.yml
      - .oxfmtrc.json
      - tsconfig.json
      - oxlint.json
      - "!**/*.md"
  pull_request:
    branches:
      - main
    paths:
      - "packages/**"
      - .github/actions/setup-bun/**
      - .github/workflows/packages-ci.yml
      - .oxfmtrc.json
      - tsconfig.json
      - oxlint.json
      - "!**/*.md"

env:
  BUN_VERSION: "canary"

jobs:
  bun-plugin-svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: |
          bun install
          pushd ./packages/bun-plugin-svelte && bun install

      - name: Lint
        run: |
          bun lint --no-script --format github --deny-warnings .
          bun fmt --no-script --config ../../.oxfmtrc.json --check .
        working-directory: ./packages/bun-plugin-svelte

      - name: Check types
        run: bun check --no-script --noEmit
        working-directory: ./packages/bun-plugin-svelte

      - name: Test
        run: bun test
        working-directory: ./packages/bun-plugin-svelte
