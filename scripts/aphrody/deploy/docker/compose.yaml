# Application aphrody-bun : ~/apps/aphrody-bun/compose.yaml sur les hôtes, inclus par ~/apps/compose.yaml (projet unique
# « aphrody », disposition tools/config/host/host-policy.toml d'aphrody). Noms de service préfixés : ils partagent le projet.
#   bun-build (vps)   docker compose -f ~/apps/compose.yaml --profile build up -d bun-build   file de déploiement, ./config/apps.json
#   bun-prod  (dbfr)  docker compose -f ~/apps/compose.yaml --profile prod up -d bun-prod     $APP_BIN de la release courante
#                     (APP_ROOT/current, activée par aphrody-deploy), ou APP_SCRIPT ; APP_BIN vide : la sonde probe.ts de l'image
services:
  bun-build:
    profiles: [build]
    image: ${IMAGE:-ghcr.io/aphrody-labs/bun:1.4.4}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUN_RELEASE: ${BUN_RELEASE:-bun-v1.4.4}
    command: ["build"]
    restart: unless-stopped
    environment:
      APHRODY_ROLE: build
      APHRODY_DEPLOY_STATE: /var/lib/aphrody-deploy
      GH_TOKEN_FILE: /run/secrets/gh_token
    volumes:
      - ./config:/config:ro
      - deploy-state:/var/lib/aphrody-deploy
      - ${SSH_DIR:-~/.ssh}:/home/agent/.ssh:ro
    secrets: [gh_token]
    cpus: "2"
    mem_limit: 8g
  bun-prod:
    profiles: [prod]
    image: ${IMAGE:-ghcr.io/aphrody-labs/bun:1.4.4}
    container_name: aphrody-bun-prod-1
    pull_policy: never
    command: ["prod"]
    restart: unless-stopped
    network_mode: host
    environment:
      APHRODY_ROLE: prod
      APP_ROOT: ${APP_ROOT:-/home/ubuntu/apps/aphrody-bun}
      APP_BIN: ${APP_BIN-bun-probe}
      APP_SCRIPT: ${APP_SCRIPT:-}
      APHRODY_BUN_SERVICE_PORT: ${PORT:-47660}
      HEALTH_URL: ${HEALTH_URL:-http://127.0.0.1:47660/healthz}
    # Same path inside: releases/current are absolute symlinks written by activate.ts.
    volumes:
      - ${APP_ROOT:-/home/ubuntu/apps/aphrody-bun}:${APP_ROOT:-/home/ubuntu/apps/aphrody-bun}:ro
secrets:
  gh_token:
    file: ${GH_TOKEN_FILE:-./config/gh_token}
volumes:
  deploy-state:
