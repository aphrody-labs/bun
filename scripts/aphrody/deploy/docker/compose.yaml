# Deux services de la même image (voir Dockerfile). Variables : BUN_RELEASE pour construire, IMAGE pour tirer.
#   build  (VPS)   docker compose --profile build up -d    file de déploiement, config dans ./config/apps.json
#   prod   (dbfr)  docker compose --profile prod up -d     exécute $APP_BIN de la release courante ou APP_SCRIPT, sinon la sonde probe.ts
name: aphrody-bun
services:
  build:
    profiles: [build]
    image: ${IMAGE:-ghcr.io/aphrody-labs/bun:1.4.3-aphrody.3}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUN_RELEASE: ${BUN_RELEASE:-aphrody-v1.4.3-aphrody.3}
    command: ["build"]
    restart: unless-stopped
    environment:
      APHRODY_ROLE: build
      APHRODY_DEPLOY_STATE: /var/lib/aphrody-deploy
      GH_TOKEN_FILE: /run/secrets/gh_token
    volumes:
      - ./config:/config:ro
      - deploy-state:/var/lib/aphrody-deploy
      - ${SSH_DIR:-~/.ssh}:/home/agent/.ssh:ro
    secrets: [gh_token]
    cpus: "2"
    mem_limit: 8g
  prod:
    profiles: [prod]
    image: ${IMAGE:-ghcr.io/aphrody-labs/bun:1.4.3-aphrody.3}
    command: ["prod"]
    restart: unless-stopped
    network_mode: host
    environment:
      APHRODY_ROLE: prod
      APP_BIN: ${APP_BIN:-}
      APP_SCRIPT: ${APP_SCRIPT:-}
      APHRODY_BUN_SERVICE_PORT: ${PORT:-47660}
      HEALTH_URL: ${HEALTH_URL:-http://127.0.0.1:47660/healthz}
    volumes:
      - ${APP_ROOT:-/srv/app}:/srv/app
secrets:
  gh_token:
    file: ${GH_TOKEN_FILE:-./config/gh_token}
volumes:
  deploy-state:
