# Source-pinned artifacts and a separate bounded cache; included in the Infra host project.
services:
  bun-release-surfaces:
    profiles: [prod]
    image: sha256:8b12917085a44f30c1dbee201c62a206be2b2e38b11c2ed2cffbfafa2b091489
    pull_policy: never
    entrypoint: [/usr/local/bin/bun]
    command: [/release/runtime/release-server.ts, /release]
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    mem_limit: 1g
    environment:
      BUN_RELEASE_REDIS_URL: redis://127.0.0.1:6388
      BUN_RELEASE_PORT: '8798'
    volumes:
      - ${BUN_RELEASE_ROOT:?verified artifact directory required}:/release:ro
      - ${BUN_RELEASE_EXECUTABLE:?qualified published executable required}:/usr/local/bin/bun:ro
    healthcheck:
      test: [CMD, /usr/local/bin/bun, -e, 'const r=await fetch("http://127.0.0.1:8798/graph/api/status");if(!r.ok)process.exit(1)']
      interval: 30s
      timeout: 5s
      retries: 3
  bun-release-cache:
    profiles: [prod]
    image: redis@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    ports: [127.0.0.1:6388:6379]
    command: [redis-server, --maxmemory, 2gb, --maxmemory-policy, allkeys-lfu, --save, '', --appendonly, 'no']
    mem_limit: 3g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
