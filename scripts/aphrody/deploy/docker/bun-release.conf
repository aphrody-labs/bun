server {
    listen 80;
    server_name bun.aphrody.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name bun.aphrody.app;
    ssl_certificate /etc/bun-release-tls/fullchain.pem;
    ssl_certificate_key /etc/bun-release-tls/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.aphrody.com; font-src 'self' https://fonts.aphrody.com data:; img-src 'self' data: https:; connect-src 'self' https://bun.com; frame-ancestors 'none'; base-uri 'self'" always;
    location / {
        proxy_pass http://127.0.0.1:8798;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
