# Aphrody Alpine (WSL2). Keys: https://learn.microsoft.com/windows/wsl/wsl-config#wslconf
# Global VM settings (memory, kernel, systemDistro, networking) go in %UserProfile%\.wslconfig:
# see docs/aphrody/wsl.md in aphrody-labs/bun.

[boot]
# No systemd and no OpenRC: WSL's /init is PID 1. wsl-boot.sh applies sysctl.d and runs
# /etc/local.d/*.start once per VM boot, as root.
systemd=false
command=/usr/libexec/aphrody/wsl-boot.sh

[automount]
enabled=true
root=/mnt/
# metadata: chmod/chown on /mnt/c work (bun install bin links, executable scripts).
options="metadata,umask=22,fmask=11"
# musl has no ldconfig: /usr/lib/wsl/lib is in /etc/ld-musl-<arch>.path instead.
ldconfig=false

[network]
generateHosts=true
generateResolvConf=true

[interop]
enabled=true
# The Windows PATH puts dozens of 9p directories in front of every command lookup of bun,
# bunsh and Bun.which. Windows tools stay reachable as /mnt/c/... or through `winpath`.
appendWindowsPath=false

[gpu]
enabled=true
appendLibPath=true

[time]
useWindowsTimezone=true
