# Aphrody Alpine (WSL2). Keys: https://learn.microsoft.com/windows/wsl/build-custom-distro
# /usr/lib/wsl is a WSL mount point (GPU libraries): the distribution's own files live elsewhere.

[oobe]
command=/usr/libexec/aphrody/wsl-oobe.sh
defaultUid=1000
defaultName=AphrodyAlpine

[shortcut]
enabled=true
icon=/usr/share/aphrody/wsl/aphrody.ico

[windowsterminal]
enabled=true
