[package]
name = "bun_docker"
version.workspace = true
edition.workspace = true
publish = false
license = "Apache-2.0"

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
bun_ssh.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
serde_json = "1.0.150"
clap = { version = "4.6.7", features = ["derive"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"

