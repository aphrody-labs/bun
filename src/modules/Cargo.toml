[package]
name = "bun_modules"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
default = ["applets", "bash"]
# Unix applets compiled in: uutils coreutils, findutils, grep and sed behind one dispatch table (applets.rs).
applets = ["dep:uu_arch", "dep:uu_base32", "dep:uu_base64", "dep:uu_basename", "dep:uu_basenc", "dep:uu_cat", "dep:uu_cksum", "dep:uu_b2sum", "dep:uu_md5sum", "dep:uu_nice", "dep:uu_sha1sum", "dep:uu_sha224sum", "dep:uu_sha256sum", "dep:uu_sha384sum", "dep:uu_sha512sum", "dep:uu_comm", "dep:uu_cp", "dep:uu_csplit", "dep:uu_cut", "dep:uu_date", "dep:uu_dd", "dep:uu_dir", "dep:uu_dircolors", "dep:uu_dirname", "dep:uu_echo", "dep:uu_expand", "dep:uu_expr", "dep:uu_factor", "dep:uu_false", "dep:uu_fmt", "dep:uu_fold", "dep:uu_head", "dep:uu_hostid", "dep:uu_join", "dep:uu_link", "dep:uu_ln", "dep:uu_ls", "dep:uu_mkdir", "dep:uu_mktemp", "dep:uu_mv", "dep:uu_nl", "dep:uu_numfmt", "dep:uu_od", "dep:uu_paste", "dep:uu_pathchk", "dep:uu_pr", "dep:uu_printenv", "dep:uu_printf", "dep:uu_ptx", "dep:uu_pwd", "dep:uu_readlink", "dep:uu_realpath", "dep:uu_rm", "dep:uu_rmdir", "dep:uu_seq", "dep:uu_shred", "dep:uu_shuf", "dep:uu_sleep", "dep:uu_sort", "dep:uu_split", "dep:uu_sum", "dep:uu_tac", "dep:uu_tail", "dep:uu_tee", "dep:uu_test", "dep:uu_touch", "dep:uu_tr", "dep:uu_true", "dep:uu_truncate", "dep:uu_tsort", "dep:uu_tty", "dep:uu_uname", "dep:uu_unexpand", "dep:uu_uniq", "dep:uu_unlink", "dep:uu_vdir", "dep:uu_wc", "dep:uu_yes", "dep:uu_df", "dep:uu_du", "dep:uu_env", "dep:uu_hostname", "dep:uu_kill", "dep:uu_nohup", "dep:uu_nproc", "dep:uu_more", "dep:uu_sync", "dep:uu_timeout", "dep:uu_uptime", "dep:uu_whoami", "dep:uu_chgrp", "dep:uu_chmod", "dep:uu_chown", "dep:uu_chroot", "dep:uu_groups", "dep:uu_id", "dep:uu_install", "dep:uu_logname", "dep:uu_mkfifo", "dep:uu_mknod", "dep:uu_stat", "dep:uu_stty", "dep:uu_pinky", "dep:uu_users", "dep:uu_who", "dep:findutils", "dep:uu_grep", "dep:sed"]

# sh and bash on rubash (GNU Bash 5.3 in Rust), from the monorepo crate src/rubash.
bash = ["dep:rubash"]

