[package]
name = "bun_arena"
version = "0.153.0"
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors"]
categories = ["compilers", "development-tools", "web-programming"]
edition = "2024"
homepage.workspace = true
include = ["/src"]
keywords = ["JavaScript", "TypeScript", "linter", "minifier", "parser"]
license = "MIT"
publish = false
repository.workspace = true
rust-version = "1.97.0"
description = "A collection of JavaScript tools written in Rust."

[[test]]
name = "arena_try_alloc"
path = "tests/arena_try_alloc.rs"
harness = false

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"]

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
non_std_lazy_statics = "allow"
result_large_err = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
cognitive_complexity = "allow"
non_send_fields_in_send_ty = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
fallible_impl_from = "allow"
useless_let_if_seq = "allow"
impl_trait_in_params = "allow"
significant_drop_in_scrutinee = "warn"
iter_on_single_items = "warn"
unused_peekable = "warn"
too_long_first_doc_paragraph = "warn"
suspicious_operation_groupings = "warn"
redundant_clone = "warn"
byte_char_slices = "allow"
question_mark = "allow"
multiple_crate_versions = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lib]
doctest = true
name = "oxc_allocator"
path = "src/lib.rs"

[dependencies.oxc_ast_macros]
version = "0.153.0"
path = "../../ast/macros"
optional = true
package = "bun_ecma_ast_macros"

[dependencies.oxc_data_structures]
version = "0.153.0"
path = "../ecma"
features = ["assert_unchecked", "stack"]
package = "bun_ecma_collections"

[dependencies.oxc_estree]
version = "0.153.0"
path = "../../ast/estree"
optional = true
package = "bun_estree"

[dependencies.allocator-api2]
version = "0.2.21"

[dependencies.hashbrown]
version = "0.17.1"
default-features = false
features = ["inline-more", "allocator-api2"]

[dependencies.rustc-hash]
version = "2"

[dependencies.serde]
version = "1"
optional = true

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_System_Memory"]
optional = true

[dev-dependencies.oxc_data_structures]
version = "0.153.0"
path = "../ecma"
features = ["types"]
package = "bun_ecma_collections"

[dev-dependencies.oxc_estree]
version = "0.153.0"
path = "../../ast/estree"
features = ["serialize"]
package = "bun_estree"

[dev-dependencies.quickcheck]
version = "1.1.0"

[dev-dependencies.rand]
version = "0.10.2"

[dev-dependencies.serde]
version = "1"

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.oxc_allocator]
path = ""
features = ["testing"]
package = "bun_arena"
version = "0.153.0"

[features]
bitset = []
fixed_size = ["from_raw_parts", "pool", "dep:oxc_ast_macros", "dep:windows-sys"]
from_raw_parts = []
pool = []
serialize = ["dep:serde", "oxc_estree/serialize"]
track_allocations = []
disable_track_allocations = []
testing = []

[package.metadata.bun.upstream]
package = "oxc_allocator"
repository = "https://github.com/oxc-project/oxc"
homepage = "https://oxc.rs"
