[package]
edition = "2024"
rust-version = "1.95.0"
name = "bun_markdown_parser"
version = "0.0.3"
authors = []
build = false
exclude = ["/tests"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A CommonMark + GFM parser that produces a span-faithful, style-preserving typed AST."
keywords = ["parser", "markdown", "commonmark"]
categories = ["parser-implementations", "text-processing"]
license = "MIT"
repository.workspace = true
publish = false

homepage.workspace = true
[lib]
name = "oxc_markdown_parser"
path = "src/lib.rs"
doctest = true

[dependencies.oxc_allocator]
version = "=0.153.0"
package = "bun_arena"
path = "../../collections/arena"

[dev-dependencies.insta]
version = "1.47"
features = ["glob"]

[lints.clippy]
allow_attributes = "warn"
branches_sharing_code = "allow"
clone_on_ref_ptr = "warn"
cognitive_complexity = "allow"
dbg_macro = "warn"
doc_markdown = "allow"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
fallible_impl_from = "allow"
filetype_is_file = "warn"
fn_params_excessive_bools = "allow"
get_unwrap = "warn"
impl_trait_in_params = "allow"
infinite_loop = "warn"
iter_on_single_items = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
non_send_fields_in_send_ty = "allow"
non_std_lazy_statics = "allow"
non_zero_suggestions = "warn"
option_if_let_else = "allow"
or_fun_call = "allow"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_underscore_fields = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
suspicious_operation_groupings = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_arguments = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
use_self = "allow"
useless_let_if_seq = "allow"
wildcard_imports = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
tail_expr_drop_order = "warn"
unit_bindings = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"]

[package.metadata.bun.upstream]
package = "oxc-markdown-parser"
repository = "https://github.com/oxc-project/oxc-markdown-parser"
