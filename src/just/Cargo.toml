[package]
name = "bun_just"
version = "1.58.0"
authors = ["Casey Rodarmor <casey@rodarmor.com>"]
autotests = false
categories = ["command-line-utilities", "development-tools"]
description = "🤖 Just a command runner"
edition = "2024"
homepage = "https://github.com/casey/just"
keywords = ["command-line", "task", "runner", "development", "utility"]
license = "CC0-1.0"
readme = "README.md"
repository = "https://github.com/aphrody-labs/just"
rust-version = "1.89.0"
publish = false

[dependencies]
blake3 = { "workspace" = true, "features" = ["mmap", "rayon", "serde"] }
camino = { "version" = "1.0.4", "features" = ["serde1"] }
chrono = { "workspace" = true }
clap = { "workspace" = true, "features" = ["derive", "env", "string", "wrap_help"] }
clap_complete = { "version" = "=4.6.8", "features" = ["unstable-dynamic"] }
clap_mangen = "0.3.0"
digest-io = "0.1.0"
dirs = "6.0.0"
dotenvy = "0.15.0"
heck = "0.5.0"
hex = "0.4.3"
is_executable = "1.0.4"
libc = { "workspace" = true }
nu-ansi-term = "0.50.3"
num_cpus = "1.15.0"
percent-encoding = "2.3.1"
pulldown-cmark = { "version" = "0.13.4", "default-features" = false }
rand = "0.10.0"
regex = { "workspace" = true }
semver = "1.0.20"
serde = { "workspace" = true, "features" = ["derive", "rc"] }
serde_json = { "workspace" = true }
sha2 = { "workspace" = true }
shellexpand = "3.1.0"
similar = { "workspace" = true, "features" = ["unicode"] }
snafu = "0.9.0"
strsim = "0.11.1"
strum = { "version" = "0.28.0", "features" = ["derive"] }
tempfile = { "workspace" = true }
typed-arena = "2.0.1"
unicode-width = "0.2.0"
uuid = { "workspace" = true, "features" = ["v4"] }
bun_no_window = { "workspace" = true }

[target.'cfg(unix)'.dependencies]
nix = { "version" = "0.31.0", "features" = ["signal", "user", "fs"] }

[target.'cfg(windows)'.dependencies]
ctrlc = { "version" = "3.1.1", "features" = ["termination"] }

[dev-dependencies]
pretty_assertions = "1.0.0"
which = { "workspace" = true }

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "just"
path = "src/main.rs"
test = false

[[test]]
name = "integration"
path = "tests/lib.rs"
