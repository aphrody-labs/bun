[package]
edition = "2024"
rust-version = "1.95.0"
name = "bun_ecma_resolver"
version = "11.24.3"
authors = ["Boshen <boshenc@gmail.com>"]
build = false
include = ["src/**/*", "README.md", "!**/tests/**/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "ESM / CJS module resolution"
homepage.workspace = true
keywords = ["node", "resolve", "cjs", "esm", "enhanced-resolve"]
categories = ["development-tools"]
license = "MIT"
repository.workspace = true
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
codspeed = ["criterion2/codspeed"]
default = []
yarn_pnp = ["pnp"]

[lib]
name = "oxc_resolver"
path = "src/lib.rs"

[dependencies.compact_str]
version = "0.10"

[dependencies.dashmap]
version = "6.2.1"
features = ["raw-api"]

[dependencies.document-features]
version = "0.2.12"
optional = true

[dependencies.fast-glob]
version = "1"

[dependencies.indexmap]
version = "2"
features = ["serde"]

[dependencies.json-strip-comments]
version = "3.1"

[dependencies.memchr]
version = "2"

[dependencies.nodejs-built-in-modules]
version = "1.0.0"

[dependencies.once_cell]
version = "1"

[dependencies.percent-encoding]
version = "2"

[dependencies.pnp]
version = "0.12.12"
optional = true

[dependencies.rustc-hash]
version = "2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]

[dependencies.simdutf8]
version = "0.1"

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"

[dev-dependencies.criterion2]
version = "3.0.3"
default-features = false

[dev-dependencies.dirs]
version = "6.0.0"

[dev-dependencies.pico-args]
version = "0.5.0"

[dev-dependencies.rayon]
version = "1.12.0"

[dev-dependencies.regress]
version = "0.12"

[dev-dependencies.vfs]
version = "0.13.0"

[dev-dependencies.walkdir]
version = "2"

[target."cfg(any(target_os = \"macos\", target_os = \"linux\"))".dependencies.rustix]
version = "1.1.4"
features = ["fs"]

[target."cfg(target_endian = \"little\")".dependencies.self_cell]
version = "1"

[target."cfg(target_endian = \"little\")".dependencies.simd-json]
version = "0.18.0"
features = ["runtime-detection"]
default-features = false

[target."cfg(target_os = \"windows\")".dependencies.windows]
version = "0.62.2"
features = ["Win32_Storage_FileSystem"]

[target."cfg(target_os = \"windows\")".dev-dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_Storage", "Win32_Storage_FileSystem"]

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
doc_markdown = "allow"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
format_push_string = "warn"
get_unwrap = "warn"
impl_trait_in_params = "warn"
infinite_loop = "warn"
literal_string_with_formatting_args = "allow"
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
pathbuf_init_then_push = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
self_named_module_files = "warn"
todo = "warn"
too_many_arguments = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_self_imports = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[package.metadata.bun.upstream]
package = "oxc_resolver"
repository = "https://github.com/oxc-project/oxc-resolver"
homepage = "https://github.com/oxc-project/oxc-resolver"
