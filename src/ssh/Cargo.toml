[package]
name = "bun_ssh"
version.workspace = true
edition.workspace = true
publish = false
license = "Apache-2.0"

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
russh = { version = "=0.64.1", default-features = false, features = ["aws-lc-rs", "rsa", "flate2"] }
russh-sftp = { path = "../../vendor/russh-sftp" }
fast_rsync = "=0.2.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros", "process", "fs"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.6.7", features = ["derive"] }
thiserror.workspace = true
rand = { version = "0.10", features = ["thread_rng"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[package.metadata.aphrody-source]
repository = "https://github.com/aphrody-labs/aphrody"
revision = "55fdf5e127"
license = "Apache-2.0"
paths = ["crates/infra/ssh/src/in_process.rs", "crates/infra/ssh/src/rsync.rs", "crates/infra/ssh/src/tunnel.rs", "crates/infra/ssh/src/lib.rs"]
