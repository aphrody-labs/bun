[package]
name = "bun_ecma_benchmark"
version = "0.0.0"
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors"]
edition = "2024"
homepage.workspace = true
keywords = ["JavaScript", "TypeScript", "linter", "minifier", "parser"]
license = "MIT"
publish = false
repository.workspace = true
description = "A collection of JavaScript tools written in Rust."
autobenches = false

[package.metadata.cargo-shear]
ignored = ["oxc", "oxc_allocator", "oxc_ast", "oxc_ast_visit", "oxc_codegen", "oxc_estree_tokens", "oxc_formatter", "oxc_isolated_declarations", "oxc_lexer", "oxc_linter", "oxc_mangler", "oxc_minifier", "oxc_parser", "oxc_react_compiler", "oxc_semantic", "oxc_span", "oxc_tasks_common", "oxc_transformer", "serde", "serde_json", "cow-utils"]

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"]

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
non_std_lazy_statics = "allow"
result_large_err = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
cognitive_complexity = "allow"
non_send_fields_in_send_ty = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
fallible_impl_from = "allow"
useless_let_if_seq = "allow"
impl_trait_in_params = "allow"
significant_drop_in_scrutinee = "warn"
iter_on_single_items = "warn"
unused_peekable = "warn"
too_long_first_doc_paragraph = "warn"
suspicious_operation_groupings = "warn"
redundant_clone = "warn"
byte_char_slices = "allow"
question_mark = "allow"
multiple_crate_versions = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lib]
test = false
bench = false
doctest = false
name = "oxc_benchmark"
path = "src/lib.rs"

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "lexer_wallclock_old"
harness = false
required-features = ["lexer_wallclock"]

[[bench]]
name = "lexer_wallclock_new"
harness = false
required-features = ["lexer_wallclock"]

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "transformer"
harness = false

[[bench]]
name = "semantic"
harness = false

[[bench]]
name = "linter"
harness = false

[[bench]]
name = "codegen"
harness = false

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "minifier"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "react_compiler"
harness = false
required-features = ["react_compiler"]

[[bench]]
name = "parser_napi"
harness = false
bench = false

[dependencies.oxc]
version = "=0.153.0"
path = "../../transpiler/ecma_engine"
optional = true
features = ["full"]
package = "bun_ecma"

[dependencies.oxc_allocator]
version = "=0.153.0"
path = "../../collections/arena"
optional = true
package = "bun_arena"

[dependencies.oxc_ast]
version = "=0.153.0"
path = "../../ast/ecma"
optional = true
features = ["serialize"]
package = "bun_ecma_ast"

[dependencies.oxc_ast_visit]
version = "=0.153.0"
path = "../../ast/visit"
optional = true
features = ["serialize"]
package = "bun_ecma_ast_visit"

[dependencies.oxc_codegen]
version = "=0.153.0"
path = "../../js_printer/ecma"
default-features = false
optional = true
features = ["sourcemap"]
package = "bun_ecma_codegen"

[dependencies.oxc_estree_tokens]
version = "=0.153.0"
path = "../../ast/estree_tokens"
optional = true
package = "bun_estree_tokens"

[dependencies.oxc_formatter]
path = "../../quality/format_js"
optional = true
package = "bun_format_js"
version = "=0.72.0"

[dependencies.oxc_isolated_declarations]
version = "=0.153.0"
path = "../../transpiler/declarations"
optional = true
package = "bun_ecma_declarations"

[dependencies.oxc_lexer]
path = "../../js_parser/lexer"
optional = true
package = "bun_ecma_lexer"
version = "=0.139.0"

[dependencies.oxc_linter]
path = "../../quality/linter"
optional = true
package = "bun_linter"
version = "=1.87.0"

[dependencies.oxc_mangler]
version = "=0.153.0"
path = "../../transpiler/mangler"
optional = true
package = "bun_ecma_mangler"

[dependencies.oxc_minifier]
version = "=0.153.0"
path = "../../transpiler/minifier"
optional = true
package = "bun_ecma_minifier"

[dependencies.oxc_parser]
version = "=0.153.0"
path = "../../js_parser/ecma"
features = ["regular_expression", "benchmarking"]
optional = true
package = "bun_ecma_parser"

[dependencies.oxc_react_compiler]
version = "=0.143.0"
path = "../../react_compiler/ecma"
optional = true
package = "bun_ecma_react_compiler"

[dependencies.oxc_semantic]
version = "=0.153.0"
path = "../../sema/ecma"
optional = true
package = "bun_ecma_semantic"

[dependencies.oxc_span]
version = "=0.153.0"
path = "../../ast/span"
optional = true
features = ["schemars", "serialize"]
package = "bun_ecma_span"

[dependencies.oxc_tasks_common]
path = "../ecma_common"
optional = true
package = "bun_ecma_common"
version = "=0.0.0"

[dependencies.oxc_transformer]
version = "=0.153.0"
path = "../../transpiler/ecma"
optional = true
package = "bun_ecma_transformer"

[dependencies.criterion2]
version = "3.0.4"
default-features = false

[dependencies.cow-utils]
version = "0.1.3"
optional = true

[dependencies.serde]
version = "1"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[features]
default = ["compiler", "linter"]
codspeed = ["criterion2/codspeed"]
codspeed_napi = ["criterion2/codspeed", "dep:serde", "dep:serde_json"]
compiler = ["dep:oxc", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_codegen", "dep:oxc_estree_tokens", "dep:oxc_formatter", "dep:oxc_isolated_declarations", "dep:oxc_mangler", "dep:oxc_minifier", "dep:oxc_parser", "dep:oxc_semantic", "dep:oxc_span", "dep:oxc_tasks_common", "dep:oxc_transformer", "dep:cow-utils"]
linter = ["dep:oxc_allocator", "dep:oxc_linter", "dep:oxc_parser", "dep:oxc_semantic", "dep:oxc_span", "dep:oxc_tasks_common", "oxc_semantic/cfg"]
react_compiler = ["dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_react_compiler", "dep:oxc_semantic", "dep:oxc_span", "dep:oxc_tasks_common"]
lexer_wallclock = ["dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_lexer", "dep:oxc_parser", "dep:oxc_span", "dep:oxc_tasks_common", "dep:cow-utils"]

[dev-dependencies.rustc-hash]
version = "2"

[package.metadata.bun.upstream]
package = "oxc_benchmark"
repository = "https://github.com/oxc-project/oxc"
homepage = "https://oxc.rs"
