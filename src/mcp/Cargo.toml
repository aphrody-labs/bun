[package]
name = "bun_mcp"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
build = "build.rs"

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
aphrody-jev = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["rt", "time"] }
bun_agent_tools.workspace = true
bun_core.workspace = true
bun_css.workspace = true
bun_browser_dom.workspace = true
bun_graph.workspace = true
bun_host.workspace = true
bun_no_window.workspace = true
bun_sys.workspace = true
bun_lsp.workspace = true
bun_valkey.workspace = true
bun_vfs.workspace = true
bun_zstd.workspace = true
const_format.workspace = true
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[build-dependencies]
zstd = { version = "0.13.3", default-features = false }
