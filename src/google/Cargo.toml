# SPDX-License-Identifier: Apache-2.0
[package]
name = "bun_google"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "Bun's Google SDK: public search (SERP, discovery, cache, browser fallback), language detection atlas and the Google project contract."

[features]
default = []
search = ["dep:bun_core", "dep:tokio", "dep:rustls", "dep:bun_browser_dom", "dep:regex", "dep:reqwest", "dep:url", "dep:chrono"]
search-cache = ["search", "dep:rusqlite"]
browser-search = ["search", "dep:bun_browser"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bun_core = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "time"] }
rustls = { workspace = true, optional = true }
bun_browser_dom = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
bun_browser = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }


[lints]
workspace = true
