[package]
name = "bun_git"
version.workspace = true
edition.workspace = true
publish = false
license = "Apache-2.0"

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
gix = { version = "=0.89.0", default-features = false, features = ["sha1", "basic", "status", "dirwalk", "excludes", "attributes", "revision", "index", "worktree-mutation", "max-performance-safe", "blocking-http-transport-reqwest-rust-tls", "credentials", "mailmap", "interrupt"] }
bun_ssh = { path = "../ssh" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.11"
thiserror.workspace = true

[package.metadata.aphrody-source]
repository = "https://github.com/aphrody-labs/aphrody"
revision = "55fdf5e127"
license = "Apache-2.0"
paths = ["crates/infra/git/src/repository.rs", "crates/infra/git/src/history.rs", "crates/infra/git/src/project.rs", "crates/infra/git/src/github.rs", "crates/infra/git/src/search.rs"]
