# Rewrites that belong to one kind of file. Same fields as scripts.toml.
# Kinds: manifest (package.json), script (a value of "scripts"), source, dockerfile, compose, ci, shell, husky,
# procfile, turbo.
[text]
{ id = "docker/node-base-alpine", kinds = ["dockerfile"], pattern = '^(\s*FROM\s+(?:--\S+\s+)*)node:\S*alpine\S*', flags = "m", replace = "${1}oven/bun:1-alpine", message = "The base image can be the Bun image, which has no Node.js or npm", autofix = true }
{ id = "docker/node-base-slim", kinds = ["dockerfile"], pattern = '^(\s*FROM\s+(?:--\S+\s+)*)node:\S*slim\S*', flags = "m", replace = "${1}oven/bun:1-slim", message = "The base image can be the Bun image, which has no Node.js or npm", autofix = true }
{ id = "docker/node-base", kinds = ["dockerfile"], pattern = '^(\s*FROM\s+(?:--\S+\s+)*)node:(?!\S*(?:alpine|slim))\S*', flags = "m", replace = "${1}oven/bun:1", message = "The base image can be the Bun image, which has no Node.js or npm", autofix = true }
{ id = "compose/node-image-alpine", kinds = ["compose"], pattern = '^(\s*image:\s*[\x22\x27]?)node:[^\s\x22\x27]*alpine[^\s\x22\x27]*', flags = "m", replace = "${1}oven/bun:1-alpine", message = "The service image can be the Bun image", autofix = true }
{ id = "compose/node-image-slim", kinds = ["compose"], pattern = '^(\s*image:\s*[\x22\x27]?)node:[^\s\x22\x27]*slim[^\s\x22\x27]*', flags = "m", replace = "${1}oven/bun:1-slim", message = "The service image can be the Bun image", autofix = true }
{ id = "compose/node-image", kinds = ["compose"], pattern = '^(\s*image:\s*[\x22\x27]?)node:(?![^\s\x22\x27]*(?:alpine|slim))[^\s\x22\x27]*', flags = "m", replace = "${1}oven/bun:1", message = "The service image can be the Bun image", autofix = true }
{ id = "ci/setup-node", kinds = ["ci"], pattern = 'uses:\s*actions/setup-node@\S+', replace = "uses: oven-sh/setup-bun@v2", message = "actions/setup-node becomes oven-sh/setup-bun", autofix = true }
{ id = "ci/node-version", kinds = ["ci"], pattern = '\bnode-version:\s*[\x22\x27]?[^\n\x22\x27]+[\x22\x27]?', replace = "bun-version: latest", message = "setup-bun reads bun-version", autofix = true }
{ id = "ci/package-manager-cache", kinds = ["ci"], pattern = '\n[ \t]*cache:[ \t]*[\x22\x27]?(?:npm|yarn|pnpm)[\x22\x27]?[ \t]*(?=\n)', replace = "", message = "setup-bun has no package manager cache input; bun install uses its own cache", autofix = true }
{ id = "ci/pnpm-setup", kinds = ["ci"], pattern = 'uses:\s*pnpm/action-setup@\S+', message = "This step installs pnpm and can be removed once the scripts use bun" }
{ id = "shebang/node", kinds = ["source", "shell"], pattern = '^#!\s*(?:/usr/bin/env\s+(?:-S\s+)?(?:node|ts-node|tsx)|/usr/bin/node|node)(?=\s|$)', replace = "#!/usr/bin/env bun", message = "The shebang can run Bun", autofix = true, aggressive = true }
{ id = "globals/__dirname", kinds = ["source"], pattern = '\b__dirname\b', replace = "import.meta.dirname", message = "In an ES module, __dirname is import.meta.dirname", autofix = true, flags = "m", requires = '^\s*(?:import|export)\s', unless = '(?:const|let|var|function)\s+__dirname\b|\b__dirname\s*=', docs = "https://bun.com/docs/runtime/module-resolution#import-meta" }
{ id = "globals/__filename", kinds = ["source"], pattern = '\b__filename\b', replace = "import.meta.filename", message = "In an ES module, __filename is import.meta.filename", autofix = true, flags = "m", requires = '^\s*(?:import|export)\s', unless = '(?:const|let|var|function)\s+__filename\b|\b__filename\s*=', docs = "https://bun.com/docs/runtime/module-resolution#import-meta" }
{ id = "turbo/lockfile-input", kinds = ["turbo"], pattern = '[\x22](?:[^\x22]*/)?(?:package-lock\.json|pnpm-lock\.yaml|yarn\.lock)[\x22]', replace = '"bun.lock"', message = "turbo.json lists a lockfile that bun install no longer writes", autofix = true }
