# Calls in JavaScript and TypeScript sources that Bun covers natively. Same fields as scripts.toml, plus import_from: the
# rule applies only to a file that imports that module (a bare name also matches its node: form). A rule with
# replace is a text substitution, so those that change when the work happens (sync to async) are aggressive.
[text]
{ id = "api/fs-readFileSync", kinds = ["source"], pattern = '\bfs\.readFileSync\s*\(\s*([^,)]+?)\s*,\s*[\x22\x27]utf-?8[\x22\x27]\s*\)', replace = "await Bun.file($1).text()", message = "Bun.file(path).text() reads a file as text", autofix = true, aggressive = true, import_from = "fs" }
{ id = "api/fs-promises-readFile", kinds = ["source"], pattern = '\b(?:fsPromises|fs\.promises)\.readFile\s*\(\s*([^,)]+?)\s*,\s*[\x22\x27]utf-?8[\x22\x27]\s*\)', replace = "await Bun.file($1).text()", message = "Bun.file(path).text() reads a file as text", autofix = true, aggressive = true }
{ id = "api/fs-writeFileSync", kinds = ["source"], pattern = '\bfs\.writeFileSync\s*\(\s*([^,]+?)\s*,\s*([^)]+?)\s*\)', replace = "await Bun.write($1, $2)", message = "Bun.write(path, data) writes a file", autofix = true, aggressive = true, import_from = "fs" }
{ id = "api/json-readFileSync", kinds = ["source"], pattern = '\bJSON\.parse\s*\(\s*fs\.readFileSync\s*\(\s*([^,)]+?)\s*,\s*[\x22\x27]utf-?8[\x22\x27]\s*\)\s*\)', replace = "await Bun.file($1).json()", message = "Bun.file(path).json() reads and parses a JSON file", autofix = true, aggressive = true, import_from = "fs" }
{ id = "api/fs-existsSync", kinds = ["source"], pattern = '\bfs\.existsSync\s*\(\s*([^)]+?)\s*\)', replace = "await Bun.file($1).exists()", message = "Bun.file(path).exists() resolves true for a file; it is false for a directory", autofix = true, aggressive = true, import_from = "fs" }
{ id = "api/sleep", kinds = ["source"], pattern = '\bnew\s+Promise\s*\(\s*\(?\s*(?:resolve|res|r)\s*\)?\s*=>\s*setTimeout\s*\(\s*(?:resolve|res|r)\s*,\s*([^)]+?)\s*\)\s*\)', replace = "Bun.sleep($1)", message = "Bun.sleep(ms) waits for a number of milliseconds", autofix = true, aggressive = true }
{ id = "api/buffer-alloc", kinds = ["source"], pattern = '\bBuffer\.alloc\s*\(\s*([^,)]+?)\s*\)', replace = "new Uint8Array($1)", message = "Uint8Array is the standard type; Buffer methods are not available on the result", autofix = true, aggressive = true }
{ id = "api/dirname-esm", kinds = ["source"], pattern = '\b(?:const|let|var)\s+__dirname\s*=\s*(?:path\.)?dirname\s*\(\s*fileURLToPath\s*\(\s*import\.meta\.url\s*\)\s*\)', replace = "const __dirname = import.meta.dirname", message = "import.meta.dirname is the directory of the module", autofix = true, aggressive = true }
{ id = "api/filename-esm", kinds = ["source"], pattern = '\b(?:const|let|var)\s+__filename\s*=\s*fileURLToPath\s*\(\s*import\.meta\.url\s*\)', replace = "const __filename = import.meta.filename", message = "import.meta.filename is the path of the module", autofix = true, aggressive = true }
{ id = "api/child-process", kinds = ["source"], pattern = '\b(?:child_process|cp)\.(?:exec|execSync|spawn|spawnSync)\s*\(', message = "Bun.spawn, Bun.spawnSync and the Bun.$ shell run commands", import_from = "child_process", severity = "info" }
{ id = "api/exec-import", kinds = ["source"], pattern = '(?<![.\w$])(?:exec|execSync)\s*\(', message = "Bun.$ and Bun.spawn run commands", import_from = "child_process", severity = "info" }
{ id = "api/http-createServer", kinds = ["source"], pattern = '\bhttps?\.createServer\s*\(', message = "Bun.serve is the fetch-based HTTP server", import_from = "http", severity = "info" }
{ id = "api/crypto-createHash", kinds = ["source"], pattern = '\bcreateHash\s*\(', message = "Bun.CryptoHasher and Bun.hash hash data", import_from = "crypto", severity = "info" }
{ id = "api/bcrypt", kinds = ["source"], pattern = '\bbcrypt(?:js)?\.(?:hash|hashSync|compare|compareSync)\s*\(', message = "Bun.password.hash and Bun.password.verify support bcrypt and argon2", severity = "info" }
{ id = "api/yaml", kinds = ["source"], pattern = '\b(?:yaml|YAML|jsYaml)\.(?:parse|load|stringify|dump)\s*\(', message = "Bun.YAML.parse and Bun.YAML.stringify read and write YAML", severity = "info" }
{ id = "api/toml", kinds = ["source"], pattern = '\bTOML\.parse\s*\(', message = "Bun.TOML.parse reads TOML", import_from = "toml", severity = "info" }
{ id = "api/escape-html", kinds = ["source"], pattern = '(?<![.\w$])(?:escapeHtml|escapeHTML)\s*\(', message = "Bun.escapeHTML escapes HTML", severity = "info" }
{ id = "api/strip-ansi", kinds = ["source"], pattern = '(?<![.\w$])stripAnsi\s*\(', message = "Bun.stripANSI removes ANSI escape codes", import_from = "strip-ansi", severity = "info" }
{ id = "api/string-width", kinds = ["source"], pattern = '(?<![.\w$])stringWidth\s*\(', message = "Bun.stringWidth measures the width of a string in a terminal", import_from = "string-width", severity = "info" }
{ id = "api/which", kinds = ["source"], pattern = '(?<![.\w$])which(?:\.sync)?\s*\(', message = "Bun.which finds an executable", import_from = "which", severity = "info" }
{ id = "api/deep-equal", kinds = ["source"], pattern = '(?<![.\w$])(?:deepEqual|isEqual|equal)\s*\(', message = "Bun.deepEquals compares two values", import_from = "fast-deep-equal", severity = "info" }
{ id = "api/glob", kinds = ["source"], pattern = '(?<![.\w$])(?:glob|globSync|fg|fastGlob)(?:\.sync)?\s*\(', message = "Bun.Glob scans the file system with a glob pattern", import_from = "glob", severity = "info" }
{ id = "api/express", kinds = ["source"], pattern = '\bexpress\s*\(\s*\)', message = "Bun.serve is a fetch-based HTTP server; Express keeps working under Bun", import_from = "express", severity = "info" }
{ id = "api/require-resolve", kinds = ["source"], pattern = '\brequire\.resolve\s*\(', message = "import.meta.resolve and Bun.resolveSync resolve a module path", severity = "info" }
{ id = "api/set-immediate", kinds = ["source"], pattern = '(?<![.\w$])setImmediate\s*\(', message = "setImmediate is not a web standard; queueMicrotask and setTimeout are", severity = "info" }
