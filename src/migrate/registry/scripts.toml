# Package manager and runtime commands in package.json scripts, shell scripts, CI files, Dockerfiles, Husky hooks and
# Procfiles. Rules run in order on the text left by the rules before them, so a specific form goes before a general one.
# Fields: id, pattern (JavaScript regular expression), flags, replace ($1 and ${1} stand for groups), message, severity
# (info, warn or error; warn by default), autofix, aggressive (a rewrite that changes behavior: only applied with
# --aggressive), kinds (default: every kind of the next line), files (base name globs), requires, unless (patterns
# that the file must match or must not match), docs.
[text]
{ id = "cli/filter-npm", pattern = '\bnpm\s+run\s+(\S+)\s+--workspaces?\b', replace = "bun run --filter '*' $1", message = "npm run --workspaces becomes bun run --filter", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/filter-pnpm", pattern = '\bpnpm\s+(?:--filter|-F)[= ]([\x22][^\x22]+[\x22]|[\x27][^\x27]+[\x27]|\S+)\s+(?:--\S+\s+)*(?:run\s+|exec\s+)?', replace = "bun run --filter $1 ", message = "pnpm --filter becomes bun run --filter", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/filter-pnpm-all", pattern = '\bpnpm\s+(?:-r|--recursive)\s+(?:--\S+\s+)*(?:run\s+)?', replace = "bun run --filter '*' ", message = "pnpm -r becomes bun run --filter '*'", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/filter-yarn", pattern = '\byarn\s+workspaces\s+(?:foreach\s+(?:-\S+\s+)*)?run\s+', replace = "bun run --filter '*' ", message = "yarn workspaces run becomes bun run --filter '*'", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/filter-yarn-workspace", pattern = '\byarn\s+workspace\s+(\S+)\s+(?:run\s+)?', replace = "bun run --filter $1 ", message = "yarn workspace becomes bun run --filter", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/filter-lerna", pattern = '\blerna\s+run\s+', replace = "bun run --filter '*' ", message = "lerna run becomes bun run --filter '*'", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/cross-env", pattern = '\bcross-env(?:-shell)?\s+', replace = "", message = "Bun's shell reads VAR=value prefixes on every platform, cross-env is not needed", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/add-dev", pattern = '\b(?:npm\s+(?:install|i)|pnpm\s+(?:add|install|i)|yarn\s+add)\s+(?:--save-dev|--dev|-D)\b', replace = "bun add --dev", message = "Add a dev dependency with bun add --dev", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/add-global", pattern = '\b(?:npm\s+(?:install|i)|pnpm\s+(?:add|install|i)|yarn\s+global\s+add)\s+(?:-g|--global)\b', replace = "bun add --global", message = "Add a global package with bun add --global", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/ci", pattern = '\b(?:npm\s+ci|pnpm\s+install\s+--frozen-lockfile|yarn\s+install\s+(?:--frozen-lockfile|--immutable))\b', replace = "bun install --frozen-lockfile", message = "A clean install from the lockfile is bun install --frozen-lockfile", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/add", pattern = '\b(?:npm\s+(?:install|i)|pnpm\s+(?:add|install|i)|yarn\s+add)\s+(?=[@A-Za-z./])', replace = "bun add ", message = "Adding packages is bun add", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/install", pattern = '\b(?:npm|pnpm|yarn)\s+(?:install|i)\b', replace = "bun install", message = "Installing dependencies is bun install", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/yarn-bare", pattern = '(^|[\n;&|(]\s*)yarn(?=\s*(?:$|[;&|)\n]))', flags = "m", replace = "${1}bun install", message = "A bare yarn installs dependencies: bun install", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/remove", pattern = '\b(?:npm\s+(?:uninstall|remove|rm|un)|pnpm\s+(?:remove|rm|uninstall)|yarn\s+remove)\b', replace = "bun remove", message = "Removing packages is bun remove", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/run", pattern = '\b(?:npm|pnpm|yarn)\s+run\s+', replace = "bun run ", message = "Running a script is bun run", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/test-start", pattern = '\b(?:npm|pnpm|yarn)\s+(test|start)\b', replace = "bun run $1", message = "bun test is Bun's test runner, so the test script runs with bun run test", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/exec", pattern = '\b(?:npx|pnpm\s+dlx|pnpm\s+exec|yarn\s+dlx|yarn\s+exec|npm\s+exec(?:\s+--)?)\s+', replace = "bunx ", message = "Running a package binary is bunx", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/update", pattern = '\b(?:npm|pnpm|yarn)\s+(?:update|upgrade|up)\b', replace = "bun update", message = "Updating dependencies is bun update", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/outdated", pattern = '\b(?:npm|pnpm|yarn)\s+outdated\b', replace = "bun outdated", message = "Listing outdated dependencies is bun outdated", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/publish", pattern = '\b(?:npm|pnpm|yarn)\s+publish\b', replace = "bun publish", message = "Publishing is bun publish", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/pack", pattern = '\b(?:npm|pnpm|yarn)\s+pack\b', replace = "bun pm pack", message = "Packing a tarball is bun pm pack", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/link", pattern = '\b(?:npm|pnpm|yarn)\s+link\b', replace = "bun link", message = "Linking a package is bun link", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/init", pattern = '\b(?:npm|pnpm|yarn)\s+init\b', replace = "bun init", message = "Creating a package.json is bun init", autofix = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "cli/node", pattern = '(^|[\s;&|(])(?:node|ts-node(?:-esm)?|tsx)(?=\s)', replace = "${1}bun", message = "Runs the script with Bun instead of Node (the runtime changes)", autofix = true, aggressive = true, kinds = ["script", "shell", "ci", "dockerfile", "husky", "procfile"] }
{ id = "source/spawn-package-manager", pattern = '\b(execa|execaSync|spawn|spawnSync|exec|execSync|execFile|execFileSync|fork)\s*\(\s*([\x22\x27`])(?:pnpm|yarn|npm)\2', replace = "$1($2bun$2", message = "A script that starts a package manager starts bun instead", autofix = true, kinds = ["source"] }
{ id = "source/spawn-npx", pattern = '\b(execa|execaSync|spawn|spawnSync|exec|execSync|execFile|execFileSync|fork)\s*\(\s*([\x22\x27`])npx\2', replace = "$1($2bunx$2", message = "A script that starts npx starts bunx instead", autofix = true, kinds = ["source"] }
{ id = "source/spawn-node", pattern = '\b(execa|execaSync|spawn|spawnSync|exec|execSync|execFile|execFileSync|fork)\s*\(\s*([\x22\x27`])node\2', replace = "$1(process.execPath", message = "A script that starts node starts the running runtime instead", autofix = true, aggressive = true, kinds = ["source"] }
{ id = "source/command-install", pattern = '([\x22\x27`])(?:pnpm|yarn|npm)\s+(?:i|install)(?:\s+--frozen-lockfile)?\b', replace = "${1}bun install", message = "A command string that installs with a package manager installs with bun", autofix = true, kinds = ["source"] }
{ id = "source/command-run", pattern = '([\x22\x27`])(?:pnpm|yarn|npm)\s+run\s', replace = "${1}bun run ", message = "A command string that runs a script with a package manager runs it with bun", autofix = true, kinds = ["source"] }
{ id = "source/command-npx", pattern = '([\x22\x27`])npx\s', replace = "${1}bunx ", message = "A command string that starts npx starts bunx", autofix = true, kinds = ["source"] }
