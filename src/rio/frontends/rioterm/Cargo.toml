[package]
name = "rioterm"
description = "Rio terminal is a hardware-accelerated GPU terminal emulator, focusing to run in desktops and browsers."
version = "0.5.28"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
rust-version = "1.96.1"
repository = "https://github.com/raphamorim/rio"
homepage = "https://rioterm.com"
documentation = "https://github.com/raphamorim/rio#readme"

[[bin]]
name = "rio"
path = "src/main.rs"

[dependencies]
global-hotkey = "0.8.0"
base64 = { version = "0.23.0" }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
wgpu = { version = "30.0.1" }
rio-backend = { path = "../../rio-backend", version = "0.5.28" }
rio-grid = { path = "../../rio-grid", version = "0.5.28" }

[dev-dependencies]
pretty_assertions = "1.4.1"
criterion = { version = "0.6.0", features = ["html_reports"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bitflags = { version = "2.9.0" }
futures = { version = "0.3.31" }
corcovado = { path = "../../corcovado", version = "0.5.28" }
regex = { version = "1.12.3" }
onig = { version = "6.5.3", default-features = false }
onig_sys = { version = "69.9.3", default-features = false }
raw-window-handle = { version = "0.6.2", features = ["std"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
notify = "8.2.0"
rustc-hash = { version = "2.1.3" }
rapidhash = { version = "4.4.1", default-features = false }
image_rs = { package = "image", version = "0.25.10", default-features = false, features = ["gif", "jpeg", "ico", "png", "pnm", "webp", "bmp", "tiff"] }
libc = { version = "0.2.189" }
parking_lot = { version = "0.12.5", features = ["nightly", "hardware-lock-elision"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
taffy = { version = "0.10.1", features = ["flexbox","grid"] }
teletypewriter = { path = "../../teletypewriter", version = "0.5.28" }
rio-unicode = { path = "../../rio-unicode", version = "0.5.28" }
url = { version = "2.5.4" }
smallvec = { version = "1.15.2", default-features = false }
rio-window = { path = "../../rio-window", version = "0.5.28", default-features = false }
lru = "0.16.0"
rio-notifier = { path = "../../rio-notifier", version = "0.5.28" }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
cpal = { version = "0.15", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = { package = "objc-rs", version = "0.3.2" }

[build-dependencies]
cfg_aliases = "0.2.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
ahash = { version = "0.8.12", default-features = false, features = ["std"] }
dunce = "1.0.5"
tinyvec = { version = "1.8.1", features = ["alloc"] }
windows-sys = { version = "0.60.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
]}
# `wgpu` backend is a hard requirement on Windows — there's no native
# DX12/Vulkan-via-ash backend yet, so without it the binary has no
# GPU rendering path. Force it on for Windows builds; Linux/macOS
# builds opt in via `--features wgpu` if they want librashader filters.
[target.'cfg(windows)'.dependencies.sugarloaf]
path = "../../sugarloaf"
version = "0.5.28"
features = ["wgpu"]
[target.'cfg(windows)'.dependencies.rio-backend]
path = "../../rio-backend"
version = "0.5.28"
features = ["wgpu"]
[target.'cfg(target_arch = "wasm32")'.dependencies.sugarloaf]
path = "../../sugarloaf"
version = "0.5.28"
features = ["wgpu"]
[target.'cfg(target_arch = "wasm32")'.dependencies.rio-backend]
path = "../../rio-backend"
version = "0.5.28"
features = ["wgpu"]

[features]
default = ["wayland", "x11", "audio", "wgpu", "native-ui"]
native-ui = ["rio-backend/native-ui", "dep:serde_json"]
audio = ["cpal"]
x11 = [
    "rio-backend/x11",
    "rio-window/x11"
]
wayland = [
    "rio-backend/wayland",
    "rio-window/wayland",
    "rio-window/wayland-dlopen",
]
wgpu = ["sugarloaf/wgpu", "rio-backend/wgpu"]

# "rio-window/wayland-csd-adwaita-crossfont",

[package.metadata.deb]
name = "rioterm"
maintainer = "Raphael Amorim <rapha850@gmail.com>"
copyright = "2022-present, Raphael Amorim <rapha850@gmail.com>"
depends = "$auto"
section = "admin"
priority = "optional"
assets = [
    ["../../target/release/rio", "usr/local/bin/", "755"],
    ["../../misc/rio.desktop", "usr/share/applications/", "644"],
    ["../../misc/rio.terminfo", "usr/share/info/", "644"],
    ["../../misc/logo.svg", "usr/share/icons/hicolor/scalable/apps/rio.svg", "644"],
    ["../../README.md", "usr/share/doc/rio/", "644"],
    ["../../LICENSE", "usr/share/doc/rio/", "664"]
]
extended-description = """\
Rio terminal is a hardware-accelerated GPU terminal emulator, focusing to run in desktops and browsers.
The supported platforms currently consist of BSD, Linux, MacOS and Windows."""

[lints]
workspace = true
