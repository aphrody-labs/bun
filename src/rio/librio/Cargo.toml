[package]
name = "librio"
version = "0.5.28"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
repository = "https://github.com/raphamorim/rio"
description = "Embeddable terminal core extracted from Rio: PTY, VT state, render-state pull API, exposed as a C ABI"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
rio-vt = { path = "../rio-vt", version = "0.5.0", default-features = false }
rio-fonts = { path = "../rio-fonts", version = "0.5.28", features = ["symbols-nerd-font"] }
rio-graphics = { path = "../rio-graphics", version = "0.5.28" }
rustc-hash = { version = "2.1.3" }
bitflags = { version = "2.9.0" }
tracing = { version = "0.1.41" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
teletypewriter = { path = "../teletypewriter", version = "0.5.28", optional = true }
corcovado = { path = "../corcovado", version = "0.5.28", optional = true }

[features]
# PTY on by default: surfaces spawn a shell and pump it on an IO thread.
# Without it (the wasm/web build) the host is the transport: bytes the
# terminal wants sent to the child go to `SurfaceDelegate::output`, and
# child output comes back in through `Surface::feed`.
default = ["pty", "graphics"]
pty = ["rio-vt/pty", "dep:teletypewriter", "dep:corcovado"]
# Image decode (png/jpeg/webp/...) and glyph-protocol font parsing for
# kitty graphics. Off in the wasm/web build: the codecs and font
# machinery are most of the binary, and the protocol paths still parse
# without them; only pixel decode is stubbed out.
graphics = ["rio-vt/graphics"]

[lints]
workspace = true
