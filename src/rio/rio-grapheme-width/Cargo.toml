[package]
name = "rio-grapheme-width"
version = "0.5.28"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/raphamorim/rio"
description = "Emoji presentation and variation-sequence tables for Rio terminal. Forked from wezterm-char-props."

[dependencies]
phf = { version = "0.13.1", default-features = false }
ucd-trie = { version = "0.1.7", default-features = false }

[features]
default = ["std"]
std = ["ucd-trie/std", "phf/std"]

[lints]
workspace = true
