[package]
name = "rio-graphics"
version = "0.5.28"
authors = ["Raphael Amorim <rapha850@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["graphics", "terminal", "application"]
repository = "https://github.com/raphamorim/rio"
description = "Terminal graphics value types (sixel/kitty/iTerm2 image data, glyph protocol) extracted from Rio"

[dependencies]
image_rs = { package = "image", version = "0.25.10", default-features = false, features = ["gif", "jpeg", "ico", "png", "pnm", "webp", "bmp", "tiff"], optional = true }
tracing = { version = "0.1.41" }
rustc-hash = { version = "2.1.3" }
skrifa = { version = "0.37.0", optional = true }
parking_lot = { version = "0.12.5", features = ["nightly", "hardware-lock-elision"], optional = true }
wgpu = { version = "30.0.1", optional = true }

# `Instant` backed by performance.now(); std's panics on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[features]
default = []
# Image decode/resize helpers (the `image` crate). Off by default so the
# value types stay lean; enabled by embedders that handle image protocols.
image = ["dep:image_rs"]
# The glyph protocol decoder pulls a font-outline parser (skrifa). Off by
# default so an embedder that only wants image graphics stays lean.
glyph = ["dep:skrifa", "dep:parking_lot"]
# `From<Color>`/`From<wgpu::Color>` conversions. Enabled by the renderer;
# off by default so the value types don't drag wgpu into a lean embed.
wgpu = ["dep:wgpu"]

[lints]
workspace = true
