[package]
edition = "2021"
rust-version = "1.60"
name = "bun_json_schema_macros"
version = "0.8.26"
authors = ["Graham Esau <gesau@hotmail.co.uk>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Macros for #[derive(JsonSchema)], for use with schemars"
readme = "README.md"
keywords = ["rust", "json-schema", "serde"]
license = "MIT"
repository.workspace = true
publish = false

homepage.workspace = true
[lib]
name = "schemars_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0"

[dependencies.quote]
version = "1.0"

[dependencies.serde_derive_internals]
version = "0.29"

[dependencies.syn]
version = "2.0"
features = ["extra-traits"]

[dev-dependencies.pretty_assertions]
version = "1.2.1"

[package.metadata.bun.upstream]
package = "oxc_schemars_derive"
repository = "https://github.com/oxc-project/schemars"
