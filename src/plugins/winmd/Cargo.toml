[package]
name = "bun_plugin_winmd"
description = "`bun winmd`, windows-bindgen with the embedded Windows metadata, built apart from the bun executable"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "bun-winmd"
path = "src/main.rs"

[dependencies]
windows-bindgen = "0.100.0"

[target.'cfg(windows)'.dependencies]
find-msvc-tools = { path = "../../../vendor/find-msvc-tools" }
