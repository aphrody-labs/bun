[package]
name = "bun_plugin_uv"
description = "`bun uv`, `uvx` and the Python compiler backend, built apart from the bun executable"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "bun-uv"
path = "src/main.rs"

[dependencies]
uv = { path = "../../../vendor/uv/crates/uv", default-features = false }
uv-command-support = { path = "../../../vendor/uv/crates/uv-command-support" }
