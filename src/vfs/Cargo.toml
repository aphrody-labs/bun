[package]
name = "bun_vfs"
version.workspace = true
edition.workspace = true
publish = false
autotests = false
license = "Apache-2.0"

[lib]
path = "lib.rs"

[lints]
workspace = true

# Leaf crate on std only (no bun_core/bun_sys), so `cargo test -p bun_vfs` links without Bun's C++
# objects; the `identifiers` feature adds the Oxc identifier matcher of bun_graph.
[dependencies]
globset = "0.4.16"
ignore = "0.4.25"
memchr = "2"
memmap2 = "0.9"
regex = "1.11"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror.workspace = true
bun_graph = { workspace = true, optional = true }

[features]
# `OxcIdentifiers`: the identifier matcher of `edit`, through bun_graph's Oxc parser (links bun_core).
identifiers = ["dep:bun_graph"]

[dev-dependencies]
tempfile = "3.27.0"
