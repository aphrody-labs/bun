[package]
name = "bun_linter"
version = "1.87.0"
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors"]
categories = ["compilers", "development-tools", "web-programming"]
edition = "2024"
homepage.workspace = true
include = ["/examples", "/src"]
keywords = ["JavaScript", "TypeScript", "linter", "minifier", "parser"]
license = "MIT"
publish = false
repository.workspace = true
rust-version = "1.97.0"
description = "A collection of JavaScript tools written in Rust."

[features]
default = []
ruledocs = ["oxc_macros/ruledocs"]
force_test_reporter = []

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"]

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
non_std_lazy_statics = "allow"
result_large_err = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
cognitive_complexity = "allow"
non_send_fields_in_send_ty = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
fallible_impl_from = "allow"
useless_let_if_seq = "allow"
impl_trait_in_params = "allow"
significant_drop_in_scrutinee = "warn"
iter_on_single_items = "warn"
unused_peekable = "warn"
too_long_first_doc_paragraph = "warn"
suspicious_operation_groupings = "warn"
redundant_clone = "warn"
byte_char_slices = "allow"
question_mark = "allow"
multiple_crate_versions = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lib]
doctest = true
name = "oxc_linter"
path = "src/lib.rs"

[dependencies.oxc_allocator]
version = "=0.153.0"
path = "../../collections/arena"
features = ["fixed_size", "bitset"]
package = "bun_arena"

[dependencies.oxc_ast]
version = "=0.153.0"
path = "../../ast/ecma"
package = "bun_ecma_ast"

[dependencies.oxc_ast_macros]
version = "=0.153.0"
path = "../../ast/macros"
package = "bun_ecma_ast_macros"

[dependencies.oxc_ast_visit]
version = "=0.153.0"
path = "../../ast/visit"
features = ["serialize"]
package = "bun_ecma_ast_visit"

[dependencies.oxc_cfg]
version = "=0.153.0"
path = "../../sema/cfg"
package = "bun_ecma_cfg"

[dependencies.oxc_codegen]
version = "=0.153.0"
path = "../../js_printer/ecma"
default-features = false
package = "bun_ecma_codegen"

[dependencies.oxc_config]
path = "../config"
package = "bun_quality_config"
version = "=0.0.0"

[dependencies.oxc_data_structures]
version = "=0.153.0"
path = "../../collections/ecma"
features = ["box_macros"]
package = "bun_ecma_collections"

[dependencies.oxc_diagnostics]
version = "=0.153.0"
path = "../diagnostics"
package = "bun_ecma_diagnostics"

[dependencies.oxc_estree_tokens]
version = "=0.153.0"
path = "../../ast/estree_tokens"
package = "bun_estree_tokens"

[dependencies.oxc_ecmascript]
version = "=0.153.0"
path = "../../sema/ecmascript"
features = ["side_effects"]
package = "bun_ecmascript"

[dependencies.oxc_index]
version = "=5.0.0"
features = ["nonmax", "serde"]
package = "bun_typed_index"
path = "../../collections/typed_index"

[dependencies.oxc_macros]
path = "../macros"
features = ["ruledocs"]
package = "bun_quality_macros"
version = "=0.0.0"

[dependencies.oxc_parser]
version = "=0.153.0"
path = "../../js_parser/ecma"
features = ["regular_expression"]
package = "bun_ecma_parser"

[dependencies.oxc_react_compiler]
version = "=0.143.0"
path = "../../react_compiler/ecma"
package = "bun_ecma_react_compiler"

[dependencies.oxc_regular_expression]
version = "=0.153.0"
path = "../../js_parser/regexp"
package = "bun_ecma_regexp"

[dependencies.oxc_resolver]
version = "=11.24.3"
package = "bun_ecma_resolver"
path = "../../resolver/ecma"

[dependencies.oxc_semantic]
version = "=0.153.0"
path = "../../sema/ecma"
features = ["cfg", "linter"]
package = "bun_ecma_semantic"

[dependencies.oxc_span]
version = "=0.153.0"
path = "../../ast/span"
features = ["schemars", "serialize"]
package = "bun_ecma_span"

[dependencies.oxc_str]
version = "=0.153.0"
path = "../../bun_core/ecma_strings"
features = ["serialize"]
package = "bun_ecma_str"

[dependencies.oxc_syntax]
version = "=0.153.0"
path = "../../ast/syntax"
features = ["serialize"]
package = "bun_ecma_syntax"

[dependencies.bitflags]
version = "2.13.0"

[dependencies.constcat]
version = "0.6.1"

[dependencies.convert_case]
version = "0.12.0"

[dependencies.cow-utils]
version = "0.1.3"

[dependencies.fast-glob]
version = "1.1.1"

[dependencies.ignore]
version = "0.4.30"

[dependencies.indexmap]
version = "2"
features = ["rayon"]

[dependencies.itertools]
version = "0.15.0"

[dependencies.javascript-globals]
version = "2.0.0"

[dependencies.json-strip-comments]
version = "3.1.1"

[dependencies.language-tags]
version = "0.3.2"

[dependencies.lazy-regex]
version = "3.6.0"

[dependencies.memchr]
version = "2.8.2"

[dependencies.nodejs-built-in-modules]
version = "1.0.0"

[dependencies.papaya]
version = "0.2.4"

[dependencies.phf]
version = "0.14.0"
features = ["macros"]

[dependencies.rayon]
version = "1.12.0"

[dependencies.rust-lapper]
version = "1.3.0"

[dependencies.rustc-hash]
version = "2"

[dependencies.schemars]
package = "bun_json_schema"
version = "=0.9.1"
features = ["indexmap2", "regex"]
path = "../../parsers/json_schema"

[dependencies.self_cell]
version = "1.2.2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]

[dependencies.simdutf8]
version = "0.1.5"
features = ["aarch64_neon"]

[dependencies.smallvec]
version = "1.15.2"
features = ["union", "serde"]

[dependencies.unicode-segmentation]
version = "1.13.3"

[dependencies.url]
version = "2.5.8"

[dev-dependencies.insta]
version = "1.48.0"

[dev-dependencies.markdown]
version = "1.0.0"

[package.metadata.bun.upstream]
package = "oxc_linter"
repository = "https://github.com/oxc-project/oxc"
homepage = "https://oxc.rs"
