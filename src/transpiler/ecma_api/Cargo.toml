[package]
name = "bun_ecma_api"
description = "Bun internal ECMAScript API: transform, isolated declarations, minify, check, resolve and analyze JS/TS, with a stable C ABI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false
keywords = ["oxc", "javascript", "typescript", "minifier", "bun"]
categories = ["development-tools", "parser-implementations", "web-programming"]

[lib]
name = "bun_ecma_api"
crate-type = ["rlib"]

[dependencies]
bun_quality.workspace = true
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true, features = ["serialize"] }
oxc_ast_visit = { workspace = true, features = ["serialize"] }
oxc_codegen = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_isolated_declarations = { workspace = true }
oxc_minifier = { workspace = true }
oxc_parser = { workspace = true }
oxc_resolver = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_transformer = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
