[package]
name = "bun_ecma_parser"
version = "0.153.0"
authors = ["Boshen <boshenc@gmail.com>", "Oxc contributors"]
categories = ["compilers", "development-tools", "web-programming"]
edition = "2024"
homepage.workspace = true
include = ["/examples", "/src"]
keywords = ["JavaScript", "TypeScript", "linter", "minifier", "parser"]
license = "MIT"
publish = false
repository.workspace = true
rust-version = "1.97.0"
description = "A collection of JavaScript tools written in Rust."

[lints.rust]
absolute_paths_not_starting_with_crate = "warn"
non_ascii_idents = "warn"
unit_bindings = "warn"
tail_expr_drop_order = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_unsafe = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(coverage)", "cfg(coverage_nightly)"]

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
self_named_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"
exit = "warn"
format_push_string = "warn"
fn_to_numeric_cast_any = "warn"
unnecessary_self_imports = "warn"
try_err = "warn"
error_impl_error = "warn"
filetype_is_file = "warn"
get_unwrap = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_safety_comment = "warn"
undocumented_unsafe_blocks = "warn"
infinite_loop = "warn"
map_with_unused_argument_over_ranges = "warn"
unused_result_ok = "warn"
pathbuf_init_then_push = "warn"
pub_underscore_fields = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
struct_excessive_bools = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
wildcard_imports = "allow"
doc_markdown = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
non_std_lazy_statics = "allow"
result_large_err = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
cognitive_complexity = "allow"
non_send_fields_in_send_ty = "allow"
use_self = "allow"
significant_drop_tightening = "allow"
branches_sharing_code = "allow"
fallible_impl_from = "allow"
useless_let_if_seq = "allow"
impl_trait_in_params = "allow"
significant_drop_in_scrutinee = "warn"
iter_on_single_items = "warn"
unused_peekable = "warn"
too_long_first_doc_paragraph = "warn"
suspicious_operation_groupings = "warn"
redundant_clone = "warn"
byte_char_slices = "allow"
question_mark = "allow"
multiple_crate_versions = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.cargo]
level = "warn"
priority = -1

[lib]
name = "oxc_parser"
path = "src/lib.rs"

[dependencies.oxc_allocator]
version = "0.153.0"
path = "../../collections/arena"
package = "bun_arena"

[dependencies.oxc_ast]
version = "0.153.0"
path = "../../ast/ecma"
package = "bun_ecma_ast"

[dependencies.oxc_data_structures]
version = "0.153.0"
path = "../../collections/ecma"
features = ["assert_unchecked", "branch_hints", "fieldless_enum"]
package = "bun_ecma_collections"

[dependencies.oxc_diagnostics]
version = "0.153.0"
path = "../../quality/diagnostics"
package = "bun_ecma_diagnostics"

[dependencies.oxc_ecmascript]
version = "0.153.0"
path = "../../sema/ecmascript"
package = "bun_ecmascript"

[dependencies.oxc_regular_expression]
version = "0.153.0"
path = "../regexp"
optional = true
package = "bun_ecma_regexp"

[dependencies.oxc_span]
version = "0.153.0"
path = "../../ast/span"
package = "bun_ecma_span"

[dependencies.oxc_str]
version = "0.153.0"
path = "../../bun_core/ecma_strings"
package = "bun_ecma_str"

[dependencies.oxc_syntax]
version = "0.153.0"
path = "../../ast/syntax"
package = "bun_ecma_syntax"

[dependencies.bitflags]
version = "2.13.0"

[dependencies.cow-utils]
version = "0.1.3"

[dependencies.num-bigint]
version = "0.5.0"

[dependencies.num-traits]
version = "0.2.19"

[dependencies.rustc-hash]
version = "2"

[dependencies.seq-macro]
version = "0.3.6"

[dependencies.memchr]
version = "2.8.2"

[dev-dependencies.oxc_ast]
version = "0.153.0"
path = "../../ast/ecma"
features = ["serialize"]
package = "bun_ecma_ast"

[dev-dependencies.oxc_ast_visit]
version = "0.153.0"
path = "../../ast/visit"
features = ["serialize"]
package = "bun_ecma_ast_visit"

[dev-dependencies.pico-args]
version = "0.5.0"

[features]
default = ["regular_expression"]
regular_expression = ["dep:oxc_regular_expression"]
mutate_tokens = []
benchmarking = []

[package.metadata.bun.upstream]
package = "oxc_parser"
repository = "https://github.com/oxc-project/oxc"
homepage = "https://oxc.rs"
