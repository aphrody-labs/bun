# SPDX-License-Identifier: Apache-2.0
[package]
name = "bun_browser_detect"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Native technology and challenge detection for Bun"

[dependencies]
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
url.workspace = true

[features]
default = ["fetch"]
# `detect_url`: bounded HTTP fetch and A/AAAA lookup. The runtime only needs `detect_response`.
fetch = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
serde_json = { workspace = true, features = ["std"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
