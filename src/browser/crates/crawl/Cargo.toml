# SPDX-License-Identifier: Apache-2.0
[package]
name = "bun_browser_crawl"
repository.workspace = true
description = "Shared persistent crawl frontier and bounded Rust crawler for Bun."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
[dependencies]
bun_browser_extract = { workspace = true }
bun_browser_dom = { workspace = true }
bun_browser_net = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
flate2 = "=1.1.10"
quick-xml = "=0.42.0"
rusqlite = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
fs4 = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

# Retained library lint baseline during native graph integration.
[lints.rust]
"unsafe_op_in_unsafe_fn" = "deny"
"unused_must_use" = "deny"
"non_ascii_idents" = "deny"

[lints.clippy]
"todo" = "deny"
"unimplemented" = "deny"
"dbg_macro" = "deny"
"correctness" = { "level" = "warn", "priority" = -1 }
"perf" = { "level" = "warn", "priority" = -1 }
