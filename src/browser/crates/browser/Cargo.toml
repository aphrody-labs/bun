[package]
name = "bun_browser_browser"
description = "Bun browser module bun_browser_browser."
version = "1.4.7"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"

[features]
default = []
stealth = ["bun_browser_net/stealth", "bun_browser_js/stealth"]
render = ["bun_browser_js/render", "dep:image"]

[dependencies]
bun_browser_dom = { workspace = true }
bun_browser_net = { workspace = true }
bun_browser_js = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Vendored upstream code (h4ckf0r0day/obscura): not held to the aphrody lint
# set, so the workspace -D warnings gate does not rewrite upstream style.
[lints.rust]
warnings = "allow"
unexpected_cfgs = "allow"
# `-D warnings` on the command line outranks the group above; name the groups
# upstream code actually trips so the vendored tree stays out of the gate.
unused = { level = "allow", priority = -1 }
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
