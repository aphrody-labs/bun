[package]
name = "bun_browser_render"
version = "1.4.7"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aphrody-labs/bun-os"
description = "Optional scoped render layer for BunBrowser: layout (taffy) and, with the paint feature, text and raster output for screenshots."

[features]
default = []
bun-css = ["dep:bun_css"]
# Rasterize the laid-out tree to a pixmap (tiny-skia) with text (cosmic-text
# shaping + line breaking, ab_glyph fallback) and images.
# Off by default; the layout core (getBoundingClientRect etc.) works without it.
paint = ["dep:bun_browser_ssrf", "dep:tiny-skia", "dep:ab_glyph", "dep:cosmic-text", "dep:swash", "dep:image", "dep:ureq", "dep:base64", "dep:resvg", "dep:usvg", "dep:url", "dep:wuff"]

[dependencies]
bun_core = { workspace = true }
bun_css = { workspace = true, optional = true }
taffy = { package = "bun_browser_layout", path = "../layout", version = "1.4.4", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "calc",
    "content_size",
    "detailed_layout_info",
] }
bun_browser_dom = { workspace = true }
bun_browser_ssrf = { workspace = true, optional = true }
tiny-skia = { version = "0.12", optional = true }
ab_glyph = { workspace = true, optional = true }
# Real inline text layout: HarfBuzz-class shaping (rustybuzz) + UAX#14 line
# breaking, the same algorithms browsers use. Built with only our embedded
# fonts (no system-font scan) so layout stays deterministic across hosts.
# Upstream BunBrowser enables `shape-run-cache` on its patched vendor/cosmic-text (cache reset in
# FontSystem::db_mut). athena-text 0.14.2 lacks that reset, so the feature stays off here.
# Fork kept over cosmic-text (checked against 0.14.2 and 0.19.0): inline.rs needs its per-span
# Attrs::css_line_break (CSS word-break/overflow-wrap, Wrap::WordOrGlyphMinContent),
# font_variations/font_optical_size/font_italic_axis (arbitrary OpenType axes), font_id (pinned
# face, FontFallbackIter skip) and LayoutGlyph axis fields. Upstream 0.19 only matches `wght`.
cosmic-text = { package = "athena-text", version = "=0.14.2", default-features = false, features = ["std", "swash"], optional = true }
# Keep this exactly aligned with the athena-text 0.14.2 raster backend. Cosmic
# and the renderer consume the same canonical variation coordinates for
# shaping and rasterization.
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"], optional = true }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"], optional = true }
# ureq 3 via the workspace pin (rustls + ring + webpki-roots, same TLS stack as ureq 2 "tls").
ureq = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# SVG rasterization for <img src="*.svg">, inline <svg>, and background-image
# SVGs, all extremely common for logos/icons. Pure Rust, CPU, no system deps,
# same deterministic-rendering guarantee as the rest of this crate.
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"], optional = true }
usvg = { version = "0.48", default-features = false, optional = true }
url = { workspace = true, optional = true }
cssparser = "0.37"
wuff = { version = "0.2.7", optional = true }
# Same `log` instance usvg emits glyph-fallback warnings through, so tests can
# install a collector and assert on them.
[dev-dependencies]
log = { workspace = true }

[lib]
path = "src/lib.rs"

# Offline paint harness (former `paint_file` binary):
# `cargo run -p bun_browser_render --features paint --example paint_file -- in.html out.png`.
[[example]]
name = "paint_file"
path = "examples/paint_file.rs"
required-features = ["paint"]

# Vendored upstream code (h4ckf0r0day/obscura): not held to the aphrody lint
# set, so the workspace -D warnings gate does not rewrite upstream style.
[lints.rust]
warnings = "allow"
unexpected_cfgs = "allow"
# `-D warnings` on the command line outranks the group above; name the groups
# upstream code actually trips so the vendored tree stays out of the gate.
unused = { level = "allow", priority = -1 }
deprecated = "allow"

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
