[package]
name = "export-cef-dir"
description = "Export pre-built CEF (Chromium Embedded Framework) archives."

version = "154.5.0+154.0.34"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Wu Yu Wei <yuweiwu@pm.me>", "Bill Avery <wravery@gmail.com>", "csmoe <csmoe@msn.com>"]
repository = "https://github.com/aphrody-labs/cef-rs"

[dependencies]
anyhow = { version = "1" }
clap = { version = "4", features = ["derive"] }
download-cef = { version = "3.0", path = "../download-cef" }
semver = { version = "1" }
serde_json = { version = "1" }

[lints]
workspace = true
