[package]
name = "get-latest"
publish = false

version = "154.5.0+154.0.34"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Wu Yu Wei <yuweiwu@pm.me>", "Bill Avery <wravery@gmail.com>", "csmoe <csmoe@msn.com>"]
repository = "https://github.com/aphrody-labs/cef-rs"

[dependencies]
download-cef = { version = "3.0", path = "../download-cef" }

clap = { version = "4", features = ["derive"] }
git-cliff = { version = "2.14" }
git-cliff-core = { version = "2" }
regex = { version = "1" }
semver = { version = "1" }
serde = { version = "1", features = ["derive"] }
thiserror = { version = "2" }
toml_edit = { version = "0.25" }

[lints]
workspace = true
