[package]
name = "cef-dll-sys"
description = "cef-rs sys crate"
links = "cef_dll_wrapper"

version = "154.5.0+154.0.34"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Wu Yu Wei <yuweiwu@pm.me>", "Bill Avery <wravery@gmail.com>", "csmoe <csmoe@msn.com>"]
repository = "https://github.com/aphrody-labs/cef-rs"

[lib]
doctest = false

[features]
dox = []
sandbox = []

[package.metadata.docs.rs]
features = ["dox"]

[build-dependencies]
anyhow = { version = "1" }
cc = { version = "1.2.8" }
cmake = { version = "0.1.52" }
download-cef = { version = "3.0", path = "../download-cef" }
serde_json = { version = "1" }
sha2 = "0.10"

[lints]
workspace = true
