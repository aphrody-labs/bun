[package]
name = "tests_shared"
publish = false

version = "154.5.0+154.0.34"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Wu Yu Wei <yuweiwu@pm.me>", "Bill Avery <wravery@gmail.com>", "csmoe <csmoe@msn.com>"]
repository = "https://github.com/aphrody-labs/cef-rs"

[features]
sandbox = ["cef/sandbox"]

[dependencies]
cef = { path = "../../cef", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_System_Performance",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3" }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2" }

[target.'cfg(target_os = "linux")'.dependencies]
glib = { version = "0.22" }
glib-unix = { version = "0.22" }

[lints]
workspace = true
