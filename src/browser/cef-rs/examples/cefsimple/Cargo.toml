[package]
name = "cefsimple"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "cefsimple"

[[bin]]
name = "cefsimple_helper"

[features]
default = [
    "sandbox",
]
sandbox = [
    "cef/sandbox",
]
linux-x11 = [
    "x11-dl",
]

[package.metadata.cef.bundle]
helper_name = "cefsimple_helper"
resources_path = "resources"

[dependencies]
cef = { path = "../../cef", default-features = false, features = ["build-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3" }
objc2-foundation = { version = "0.3.2" }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSResponder", "NSUserInterfaceValidation", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = { version = "0.1" }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { version = "2", optional = true }

[lints]
workspace = true
