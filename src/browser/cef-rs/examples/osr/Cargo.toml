[package]
name = "cef-osr"
edition = "2024"
publish = false

[features]
default = ["accelerated_osr"]
accelerated_osr = ["cef/accelerated_osr"]

[package.metadata.cef.bundle]
helper_name = "cefsimple_helper"

[dependencies]
cef = { path = "../../cef", default-features = false }
wgpu = { version = "30" }

env_logger = "0.11"
pollster = "0.4"
tokio = { version = "1", features = ["full"] }
winit = { version = "0.30" }
bytemuck = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12"] }
# For gpu debugging on Windows with PIX
libloading = { version = "0.9" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = { version = "0.3.2" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2" }

[lints]
workspace = true
