[package]
name = "update-bindings"
publish = false

version = "154.5.0+154.0.34"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Wu Yu Wei <yuweiwu@pm.me>", "Bill Avery <wravery@gmail.com>", "csmoe <csmoe@msn.com>"]
repository = "https://github.com/aphrody-labs/cef-rs"

[dependencies]
download-cef = { version = "3.0", path = "../download-cef" }

bindgen = { version = "0.73" }
clap = { version = "4", features = ["derive"] }
convert_case = { version = "0.12" }
proc-macro2 = { version = "1" }
quote = { version = "1" }
regex = { version = "1" }
semver = { version = "1" }
syn = { version = "3", features = ["full"] }
thiserror = { version = "2" }

[lints]
workspace = true
