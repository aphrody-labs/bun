[package]
name = "cef"
description = "Use cef in Rust"

version = "154.5.0+154.0.34"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Wu Yu Wei <yuweiwu@pm.me>", "Bill Avery <wravery@gmail.com>", "csmoe <csmoe@msn.com>"]
repository = "https://github.com/aphrody-labs/cef-rs"

[lib]

[[bin]]
name = "bundle-cef-app"

[features]
default = ["sandbox", "build-util", "resources"]
dox = ["cef-dll-sys/dox"]
sandbox = ["cef-dll-sys/sandbox"]
resources = []

# Unified texture import system for CEF hardware acceleration
accelerated_osr = [
    "ash",
    "libc",
    "objc2-foundation",
    "objc2-io-surface",
    "objc2-metal",
    "thiserror",
    "tracing",
    "wgpu",
    "windows",
]

# Build utilities, including the bundle-cef-app tool.
build-util = [
    "anyhow",
    "cargo_metadata",
    "clap",
    "plist",
    "semver",
    "serde",
    "serde_json",
    "thiserror",
]

# Linux X11 support in bundle-cef-app.
linux-x11 = []

[package.metadata.docs.rs]
features = ["dox"]

[dependencies]
cef-dll-sys = { version = "154.5.0", path = "../sys" }

# accelerated_osr
ash = { version = "0.38", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
wgpu = { version = "30", optional = true }

# bundle
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
cargo_metadata = { version = "0.23.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = { version = "0.9" }
objc2 = { version = "0.6.3" }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-io-surface = { version = "0.3.2", optional = true }
objc2-metal = { version = "0.3", features = ["objc2-io-surface"], optional = true }
plist = { version = "1", optional = true }
semver = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[lints]
workspace = true
