[package]
name = "download-cef"
description = "Download and extract pre-built CEF (Chromium Embedded Framework) archives."
version = "3.0.0"

edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Wu Yu Wei <yuweiwu@pm.me>", "Bill Avery <wravery@gmail.com>", "csmoe <csmoe@msn.com>"]
repository = "https://github.com/aphrody-labs/cef-rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = { version = "1" }
semver = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }

bzip2 = "0.6"
indicatif = "0.18"
sha1_smol = "1"
tar = "0.4"
ureq = { version = "3", features = ["json", "socks-proxy"] }
fs-err = "3.2.2"

[lints]
workspace = true
